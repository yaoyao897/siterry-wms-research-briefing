<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>思特瑞 WMS 项目调研汇报</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<style>
:root {
  --bg: #f4f6f9;
  --panel: #ffffff;
  --panel2: #f0f3f7;
  --border: #d8dee8;
  --text: #1a2332;
  --muted: #5b6b7c;
  --accent: #2563eb;
  --accent2: #059669;
  --warn: #d97706;
  --warn-bg: #fff7ed;
  --asis: #2563eb;
  --tobe: #059669;
  --sidebar-w: 280px;
  --radius: 12px;
  --shadow: 0 4px 20px rgba(26,35,50,.08);
  font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); }
body { display: flex; min-height: 100vh; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.sidebar {
  width: var(--sidebar-w);
  flex: 0 0 var(--sidebar-w);
  background: #ffffff;
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow: hidden;
}
.brand {
  padding: 20px 18px 14px;
  border-bottom: 1px solid var(--border);
}
.brand h1 {
  margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .02em;
  color: #0f172a;
}
.brand p { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.nav {
  overflow: auto; padding: 10px 10px 24px; flex: 1;
}
.nav-group {
  margin-top: 14px; padding: 0 8px 6px;
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
}
.nav button {
  width: 100%; text-align: left; border: 0; background: transparent;
  color: var(--text); padding: 9px 10px; border-radius: 8px;
  font-size: 13px; cursor: pointer; display: flex; gap: 8px; align-items: flex-start;
}
.nav button:hover { background: var(--panel2); }
.nav button.active {
  background: #eff6ff; color: #1e40af;
  box-shadow: inset 3px 0 0 var(--accent);
}
.nav .idx {
  flex: 0 0 20px; color: var(--muted); font-variant-numeric: tabular-nums;
}

.main {
  flex: 1; min-width: 0; overflow: auto;
  background:
    radial-gradient(1000px 500px at 0% 0%, rgba(37,99,235,.06), transparent 50%),
    radial-gradient(800px 400px at 100% 0%, rgba(5,150,105,.05), transparent 45%),
    var(--bg);
}
.topbar {
  position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,.92);
  border-bottom: 1px solid var(--border);
  padding: 12px 28px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.topbar h2 { margin: 0; font-size: 18px; font-weight: 650; }
.topbar .meta { font-size: 12px; color: var(--muted); }
.content { padding: 16px 20px 40px; max-width: none; }
.content.scene-mode { display: flex; flex-direction: column; min-height: calc(100vh - 70px); }
.card.diagram-card { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-bottom: 0; }

.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 20px 22px;
  margin-bottom: 18px;
}
.card h3 { margin: 0 0 12px; font-size: 16px; }
.muted { color: var(--muted); font-size: 13px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 980px) {
  body { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: relative; }
  .grid-2 { grid-template-columns: 1fr; }
}

table {
  width: 100%; border-collapse: collapse; font-size: 13px;
}
th, td {
  border-bottom: 1px solid var(--border); padding: 10px 8px; text-align: left; vertical-align: top;
}
th { color: var(--muted); font-weight: 600; font-size: 12px; }
.status-pill {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px;
  background: #eef2f7; color: #334155;
}
.status-pill.doing { background: #fff7ed; color: #c2410c; }
.status-pill.done { background: #ecfdf5; color: #047857; }
.status-pill.todo { background: #eff6ff; color: #1d4ed8; }

.qs {
  background: #fffbeb;
  border: 1px solid #fde68a;
  border-left: 4px solid var(--warn);
  border-radius: 10px; padding: 14px 16px; margin-top: 14px;
}
.qs h4 { margin: 0 0 8px; color: #b45309; font-size: 13px; }
.qs ul { margin: 0; padding-left: 18px; }
.qs li { margin: 4px 0; font-size: 13px; }

.tabs {
  display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;
}
.tabs button {
  border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  border-radius: 999px; padding: 7px 14px; cursor: pointer; font-size: 13px;
}
.tabs button.active.asis { border-color: var(--asis); background: #dbeafe; color: #1e40af; }
.tabs button.active.tobe { border-color: var(--tobe); background: #d1fae5; color: #065f46; }
.tabs button.active { outline: none; }

.diagram-toolbar {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  margin-bottom: 10px;
}
.diagram-toolbar button, .diagram-toolbar label {
  border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 12px;
}
.diagram-frame {
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #f8fafc;
  color: #0f172a;
  overflow: hidden;
  flex: 1;
  min-height: calc(100vh - 240px);
  height: calc(100vh - 240px);
  padding: 0;
  position: relative;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-user-drag: none;
}
.diagram-frame:active, .diagram-frame.dragging { cursor: grabbing; }
.diagram-frame .mermaid-stage {
  position: absolute;
  left: 0; top: 0;
  transform-origin: 0 0;
  will-change: transform;
  user-select: none;
  -webkit-user-select: none;
}
.diagram-frame .mermaid {
  width: max-content;
  min-width: 100%;
  padding: 24px;
  user-select: none;
  -webkit-user-select: none;
}
.diagram-frame .mermaid svg,
.diagram-frame .mermaid svg * {
  max-width: none !important;
  user-select: none !important;
  -webkit-user-select: none !important;
}
.diagram-frame .mermaid svg {
  height: auto !important;
}
/* 泳道（subgraph）线框加粗加深 */
.diagram-frame .mermaid .cluster rect,
.fs-stage .mermaid .cluster rect {
  stroke: #334155 !important;
  stroke-width: 2.5px !important;
  rx: 6px;
  ry: 6px;
  fill: #f1f5f9 !important;
  fill-opacity: 0.95 !important;
}
.diagram-frame .mermaid .cluster-label,
.diagram-frame .mermaid .cluster span,
.fs-stage .mermaid .cluster-label,
.fs-stage .mermaid .cluster span {
  font-weight: 700 !important;
  color: #0f172a !important;
}
.diagram-frame .mermaid .cluster-label foreignObject div,
.fs-stage .mermaid .cluster-label foreignObject div {
  color: #0f172a !important;
  font-weight: 700 !important;
}
.diagram-hint {
  font-size: 12px; color: var(--muted); margin-top: 8px;
}
.diagram-toolbar .primary {
  background: #dbeafe;
  border-color: var(--accent);
  color: #1e40af;
  font-weight: 600;
}
/* 全屏浮层 */
.fs-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: #eef2f7;
  display: none;
  flex-direction: column;
}
.fs-overlay.open { display: flex; }
.fs-bar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px;
  background: #ffffff;
  border-bottom: 1px solid var(--border);
}
.fs-bar .title { font-size: 14px; font-weight: 600; }
.fs-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.fs-bar button {
  border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px;
}
.fs-stage-wrap {
  flex: 1; min-height: 0; position: relative;
  overflow: hidden; cursor: grab; background: #f8fafc;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}
.fs-stage-wrap:active, .fs-stage-wrap.dragging { cursor: grabbing; }
.fs-stage {
  position: absolute; left: 0; top: 0;
  transform-origin: 0 0; will-change: transform;
  padding: 32px;
  user-select: none;
  -webkit-user-select: none;
}
.fs-stage .mermaid svg { max-width: none !important; height: auto !important; }
.fs-stage .mermaid svg * {
  user-select: none !important;
  -webkit-user-select: none !important;
}
.fs-tip { font-size: 12px; color: var(--muted); }
.prose p, .prose li { font-size: 14px; line-height: 1.65; color: #d5dde8; }
.prose ul, .prose ol { padding-left: 1.25rem; }
.prose strong { color: #0f172a; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  background: var(--panel2); color: var(--muted); border: 1px solid var(--border);
}
.scene-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.hidden { display: none !important; }
.loading { color: var(--muted); font-size: 13px; padding: 24px; }
.overview-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px;
}
.overview-card {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
  padding: 14px; cursor: pointer; transition: .15s ease;
}
.overview-card:hover { border-color: var(--accent); transform: translateY(-1px); }
.overview-card .n { color: var(--accent); font-size: 12px; margin-bottom: 4px; }
.overview-card .t { font-size: 13px; font-weight: 600; }

/* 甘特图 */
.gantt-wrap { margin-top: 20px; }
.gantt-wrap h4 { margin: 0 0 12px; font-size: 14px; color: var(--text); }
.gantt {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: #fff;
}
.gantt-head, .gantt-row {
  display: grid;
  grid-template-columns: 110px 1fr;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
}
.gantt-row:last-child { border-bottom: 0; }
.gantt-head { background: #f8fafc; font-size: 12px; color: var(--muted); font-weight: 600; }
.gantt-label {
  padding: 10px 12px;
  border-right: 1px solid var(--border);
  display: flex; align-items: center;
  font-size: 13px; font-weight: 600; color: var(--text);
}
.gantt-track {
  position: relative;
  height: 44px;
  background: repeating-linear-gradient(
    90deg,
    transparent,
    transparent calc(100% / 33 - 1px),
    #e8edf3 calc(100% / 33 - 1px),
    #e8edf3 calc(100% / 33)
  );
}
.gantt-axis {
  position: relative;
  height: 28px;
  font-size: 11px;
  color: var(--muted);
}
.gantt-axis-inner { position: relative; height: 100%; margin: 0; }
.gantt-tick {
  position: absolute; top: 6px; transform: translateX(-50%);
  white-space: nowrap;
}
.gantt-bar {
  position: absolute;
  top: 10px; height: 24px;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 600; color: #fff;
  box-shadow: 0 1px 3px rgba(15,23,42,.12);
  min-width: 4px;
}
.gantt-bar.done { background: linear-gradient(90deg, #059669, #10b981); }
.gantt-bar.doing { background: linear-gradient(90deg, #d97706, #f59e0b); }
.gantt-bar.todo { background: linear-gradient(90deg, #2563eb, #3b82f6); }
.gantt-bar.milestone { background: linear-gradient(90deg, #b45309, #ea580c); }
.gantt-today {
  position: absolute; top: 0; bottom: 0; width: 2px;
  background: #ef4444; z-index: 2; pointer-events: none;
}
.gantt-today::after {
  content: '今天';
  position: absolute; top: 2px; left: 4px;
  font-size: 10px; color: #ef4444; font-weight: 700;
}
.gantt-legend {
  display: flex; gap: 14px; flex-wrap: wrap;
  margin-top: 10px; font-size: 12px; color: var(--muted);
}
.gantt-legend span { display: inline-flex; align-items: center; gap: 6px; }
.gantt-legend i {
  width: 12px; height: 12px; border-radius: 3px; display: inline-block;
}
</style>
</head>

</div>

系统颜色说明\n        direction LR\n        LEG1[ERP]:::erp\n        LEG2[WMS]:::wms\n        LEG3[Lims]:::lims\n        LEG4[线下/人工]:::manual\n    end\n\n    subgraph sgBiz[\"业务/采购\"]\n        A1[在ERP新增请购单-采购或备件]:::erp\n        A2[在ERP新增采购订单]:::erp\n        A2w[在ERP新增委外采购订单]:::erp\n        A3[在ERP新增受托加工订单]:::erp\n        S1[ERP推送采购/委外/受托订单至WMS]:::erp\n        A4{配送方式?}\n        A5[在WMS新增派车申请]:::wms\n        A6[在WMS手动新增来料通知单]:::wms\n        A6b[在WMS手动新增来料通知单]:::wms\n    end\n\n    subgraph sgLog[\"物流部\"]\n        L1[对接承运并完成派车申请流程数据]:::wms\n        L2[组合发货单成运单]:::wms\n    end\n\n    subgraph sgWh[\"库管/装卸工\"]\n        B1[完成了卸车并移至库房]:::manual\n        B2[在WMS登记装卸单]:::wms\n        B3{收货形态?}\n        B4[在WMS打印并粘贴条码]:::wms\n        B5[执行扫码入库生成采购/委外/受托入库单]:::wms\n        B6[完成了槽车物料打入储罐]:::manual\n        B7[在WMS办理槽车入库并选择储罐与数量]:::wms\n        B8[在WMS按批号登记备品备件数量入库]:::wms\n    end\n\n    subgraph sgQc[\"质检员\"]\n        C1[执行取样质检混检或不合格逐袋检]:::manual\n        C2[执行槽车一车一检取样]:::manual\n        C3[在Lims录入质检结果]:::lims\n    end\n\n    subgraph sgSys[\"系统自动\"]\n        S0[根据通知单与派车申请<br/>自动生成发货单]:::wms\n        S2[WMS推送入库数据至ERP]:::wms\n        S3[Lims推送质检结果至WMS]:::lims\n    end\n\n    A1 --> A2\n    A2 --> S1\n    A2w --> S1\n    A3 --> S1\n    S1 --> A4\n    A4 -->|我方配送/提货| A5\n    A4 -->|对方配送/客户自送| A6b\n    A5 --> L1\n    L1 --> A6\n    A6 --> S0\n    S0 --> L2\n    L2 --> B1\n    A6b --> B1\n    B1 --> B2\n    B2 --> B3\n    B3 -->|包装类含受托| B4\n    B4 --> B5\n    B5 --> S2\n    B4 --> C1\n    C1 --> C3\n    C3 --> S3\n    B3 -->|槽车仅正常采购| B6\n    B6 --> B7\n    B7 --> S2\n    B3 -->|槽车仅正常采购| C2\n    C2 --> C3\n    B3 -->|备品备件| B8\n    B8 --> S2\n\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef mes fill:#ede9fe,stroke:#8b5cf6;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<ol>\n<li>建单：正常采购/备品备件在 OA 提交采购需求后采购部 ERP 下采购订单；委外采购在 OA 提交委外申请后 ERP 下委外采购订单；<strong>受托加工由业务/销售在 ERP 直接创建受托加工订单</strong>。</li>\n<li>配送方式分支：</li>\n</ol>\n<p>   - 我方配送/提货：采购或业务在 OA 发起派车需求，物流部与承运商确定运输内容后，下推来料通知；</p>\n<p>   - 对方配送（供应商/加工厂/客户自送）：对方按计划送达；。</p>\n<ol>\n<li>货物到场后，装卸工卸车并移至库房（受托入<strong>受托来料仓</strong>），线下记录装卸情况。</li>\n<li>收货形态分支：</li>\n</ol>\n<p>   - 包装类（吨袋/小包装/半成品/受托原料等）：库管粘贴待检标签（吨袋）后，仓管通知业务/采购在 ERP 办理入库过账（<strong>采购入库 / 委外入库 / 受托来料入库</strong>）；同步质检员取样质检（混检，不合格再逐袋检；Lims），合格后粘贴合格标签（入库与质检并行，不等待质检结果）。</p>\n<p>   - 槽车（仅正常采购）：质检员按一车一检取样并在 Lims 录入；同时现场工人打入储罐，仓管通知采购在 ERP 办理入库过账（入库与质检并行）。</p>\n<p>   - 备品备件：不贴码、不质检；仓管/采购在 ERP 直接按数量办理入库；领用等出库亦在 ERP 按数量办理。</p>","tobeHtml":"<ol>\n<li><strong>建单</strong>：正常采购/备品备件——需求部门在 <strong>ERP 提请购单</strong>，采购在 ERP 新增采购订单；委外采购——业务/销售在 ERP 新增委外采购订单；受托加工——业务/销售在 ERP 新增受托加工订单。</li>\n<li><strong>订单同步</strong>：ERP 推送采购/委外/受托订单至 WMS（<strong>无 MES</strong>，不推送 MES）。</li>\n<li><strong>配送 / 到货通知</strong>：</li>\n</ol>\n<p>   - 我方配送/提货：业务/采购在 WMS 新增派车申请 → 物流部执行审批并确认承运 → 物流部在 WMS 下推来料通知单（关联对应订单）；</p>\n<p>   - 对方配送/客户自送：业务/采购在 WMS 直接新增来料通知单。</p>\n<ol>\n<li><strong>到厂收货</strong>：装卸工完成卸车并移至库房（受托入受托来料仓）→ 在 WMS 登记装卸单。</li>\n<li><strong>收货形态</strong>（入库与质检并行，不等待质检结果）：</li>\n</ol>\n<p>   - <strong>包装类</strong>（含受托原料）：库管在 WMS 打印并粘贴条码（须在扫码入库前完成）→ 执行扫码入库生成对应入库单 → WMS 推送入库数据至 ERP；同步质检员执行取样质检 → 在 Lims 录入 → Lims 推送质检结果至 WMS 条码档案。</p>\n<p>   - <strong>槽车</strong>（仅正常采购）：质检员执行一车一检取样并在 Lims 录入；现场完成打入储罐；库管在 WMS 办理槽车入库（选储罐+数量）→ WMS 推送至 ERP；Lims 事后推送结果至 WMS。</p>\n<p>   - <strong>备品备件</strong>：不质检；在 WMS <strong>按批号维度登记数量入库</strong> → WMS 推送至 ERP（非最小包装扫码入库）。</p>\n<p>| 业务类型 | ERP前置/订单 | 来料通知 | WMS/ERP入库单据 | 目标仓 |</p>\n<p>| --- | --- | --- | --- | --- |</p>\n<p>| 正常采购 | 请购单 → 采购订单 | 来料通知单 | 采购入库 | 原辅料仓/储罐 |</p>\n<p>| 委外采购 | 委外采购订单 | 来料通知单 | 委外入库 | 半成品/成品仓 |</p>\n<p>| 受托加工 | 受托加工订单 | 来料通知单 | 受托来料入库 | 受托加工来料仓 |</p>\n<p>| 备品备件 | 请购单 → 采…</p>"},{"id":"s2","title":"场景二：采购类退料（正常采购退料 / 委外采购退料）","qs":["采购换货再入库：挂原采购订单还是新订单？","是否应等质检合格后再做采购入库，避免再退货？","线下换货后条码不变动时，如何保证账物一致？"],"diagrams":[{"label":"现状（As-Is）","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[OA]:::oa\n        L3[线下/人工]:::manual\n    end\n    subgraph 质量业务[\"质量/业务\"]\n        A1[\"线下不合格评审或OA原材<br/>料投诉\"]:::manual\n        A2{评审结论}\n    end\n    subgraph 仓库对方[\"仓库/供应商或三方\"]\n        B1[对方重新发货-换货]:::manual\n        B2[ERP不做库存帐变动]:::manual\n        B3[让步-直接使用]:::manual\n        B4[正常采购降级-ERP形态转化]:::erp\n    end\n    A1 --> A2\n    A2 -->|退换货| B1\n    B1 --> B2\n    A2 -->|让步| B3\n    A2 -->|降级仅正常采购| B4\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"},{"label":"To-Be","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[WMS]:::wms\n        L2[线下/人工]:::manual\n    end\n    subgraph sgQa[\"质量/业务\"]\n        A1[执行不合格评审或原材料投诉]:::manual\n        A2{评审结论?}\n    end\n    subgraph sgQc[\"质检部\"]\n        C1[\"在WMS将条码检验状态改<br/>为合格\"]:::wms\n        C2[可继续领料使用]:::wms\n    end\n    subgraph sgWh[\"库管\"]\n        B1[在WMS新增采购退料通知单]:::wms\n        B2[执行扫码出库退供应商或三方]:::wms\n    end\n    subgraph sgVendor[\"对方/再入库\"]\n        E1[对方重新发货]:::manual\n        E2[\"执行场景一对应来料入库完<br/>整流程\"]:::wms\n    end\n    A1 --> A2\n    A2 -->|退货| B1\n    B1 --> B2\n    A2 -->|换货| B1\n    B2 -->|换货继续| E1\n    E1 --> E2\n    A2 -->|让步| C1\n    C1 --> C2\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<ul>\n<li><strong>正常采购</strong>：线下执行原材料不合格评审；退换货由供应商重新发货，不走 ERP 库存帐；让步直接使用；降级在 ERP 走形态转化。</li>\n<li><strong>委外采购</strong>：在 OA 发起原材料投诉并走换货，ERP 不做库存变动。</li>\n</ul>","tobeHtml":"<ol>\n<li><strong>退货</strong>：在 WMS 新增采购退料通知单 → 仓管扫码出库退回供应商/三方（走完采购退料即可）。</li>\n<li><strong>换货</strong>：先走完采购退料 → 对方重新发货后，再走<strong>场景一对应来料入库完整流程</strong>（正常采购→采购入库；委外→委外入库）。</li>\n<li><strong>让步</strong>：<strong>质检部</strong>在 WMS 将条码检验状态改为合格后，可继续领料使用。</li>\n</ol>\n<p>（无降级处理分支。）</p>\n<p>| 业务类型 | 退料对象 | 退料单据 | 换货后再入库 |</p>\n<p>| --- | --- | --- | --- |</p>\n<p>| 正常采购 | 供应商 | 采购退料通知单 → 扫码出库 | 场景一采购入库全流程 |</p>\n<p>| 委外采购 | 三方加工厂 | 采购退料通知单 → 扫码出库 | 场景一委外入库全流程 |</p>"},{"id":"s3","title":"场景三：领料（生产领料至线边仓 / 备品备件领用）","qs":["备品备件领用：确认采用方案二（门禁验人+账号扫码，无预开申请）？","装卸单是否一律由出入库通知单/申请单下推？","门禁与 WMS 用户名单对接方式？"],"diagrams":[{"label":"现状·生产领料（As-Is）","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[线下/人工]:::manual\n    end\n    subgraph 生产\n        P1[线下提出生产领料单]:::manual\n        P2[在领料区使用原料]:::manual\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        B1[货物移至领料区-线边仓]:::manual\n        C1[在ERP办理领料出库]:::erp\n    end\n    P1 --> B1\n    B1 --> C1\n    C1 --> P2\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"},{"label":"To-Be·生产领料","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[WMS]:::wms\n        L2[ERP]:::erp\n        L3[线下/人工]:::manual\n    end\n    subgraph 生产\n        P1[在WMS提交生产领料申请单]:::wms\n label":"To-Be","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[WMS]:::wms\n        L3[Lims]:::lims\n        L4[线下/人工]:::manual\n    end\n    subgraph 质检部门[\"质检部门\"]\n        D1[在Lims完成成品质检]:::lims\n        D2[合格批号条码推送WMS建档]:::lims\n        D3[\"在WMS发起生产入库申请<br/>并勾选条码\"]:::wms\n    end\n    subgraph 生产[\"生产\"]\n        P1[打印并粘贴条码至成品吨袋]:::manual\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        B1[完成货物转移]:::manual\n        B2[在WMS登记装卸单]:::wms\n        C1[在WMS扫码确认入库]:::wms\n        E1[\"WMS推送入库数据至ER<br/>P过账\"]:::wms\n        C3[在WMS新增转仓申请单]:::wms\n        C4[扫码办理转仓]:::wms\n        E2[\"WMS推送转仓数据至ER<br/>P更新库存\"]:::wms\n    end\n    D1 --> D2\n    D2 --> P1\n    P1 --> D3\n    D3 --> B1\n    B1 --> B2\n    B2 --> C1\n    C1 --> E1\n    E1 --> C3\n    C3 --> C4\n    C4 --> E2\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<p>质检在Lims完成质检数据工作，成品合格后由质量部通知库管在ERP办理生产入库，再办理转仓。</p>","tobeHtml":"<ol>\n<li>质检在Lims完成质检数据工作，成品合格后推送WMS合格的批号条码，自动创建成品条码档案数据。</li>\n<li>生产打印并粘贴条码至成品吨袋上。</li>\n<li>质检部在WMS发起生产入库申请，勾选可入库的条码。</li>\n<li>装卸工完成货物转移，并在WMS完成装卸单登记。</li>\n<li>库管在WMS扫码确认后，WMS推送入库数据至ERP过账。</li>\n<li>库管在WMS新增转仓申请单；再扫码办理转仓；WMS推送转仓数据至ERP更新库存。</li>\n</ol>"},{"id":"s6","title":"场景六：生产退料","qs":["备品备件领用后是否允许退料？","若退料，ERP 用其他入库还是其他单据？如何保证线上线下一致？"],"diagrams":[{"label":"现状（As-Is）","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[线下/人工]:::manual\n    end\n    subgra    subgraph 库管装卸[\"装卸工/仓管\"]\n        B1[按通知发货出库]:::manual\n        B2[办理出门手续]:::manual\n    end\n    A1 --> A2\n    A2 --> A3\n    A3 -->|我方配送| A4\n    A4 --> A5\n    A3 -->|客户自提| A5\n    A5 --> B1\n    B1 --> B2\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"},{"label":"To-Be","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[WMS]:::wms\n        L3[线下/人工]:::manual\n    end\n    subgraph 销售\n        A1[在ERP创建销售订单]:::erp\n        A2[在WMS下发订单备货]:::wms\n        A4{配送方式}\n        A5[在WMS发起派车申请]:::wms\n        A6[手动新增销售发货通知单]:::wms\n        A6b[手动新增销售发货通知单]:::wms\n    end\n    subgraph 物流部\n        LG1[对接承运并完成派车申请流程数据]:::wms\n        LG2[组合发货单成运单]:::wms\n    end\n    subgraph 系统自动\n        S0[根据通知单与派车申请<br/>自动生成发货单]:::wms\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        C1[挑选条码并完成备货绑定]:::wms\n        C2[按销售发货通知单扫码出库并校验备货条码]:::wms\n        C2b[在WMS完成装卸单登记]:::wms\n        C3[在WMS打印出门单]:::wms\n        C4[完成装货]:::manual\n    end\n    subgraph 承运司机[\"承运商/司机\"]\n        D1[完成装货确认]:::wms\n        D2{是否多次装货}\n        D3[出门进入在途]:::wms\n        D4[每日更新在途状态]:::wms\n        D5[到达卸货点完成卸货确认]:::wms\n        D6{是否多次卸货}\n        D7[全部装卸货点确认-运单完成]:::wms\n        D8[WMS推送ERP生成采购单-运输费用]:::wms\n    end\n    A1 --> A2\n    A2 --> C1\n    A2 --> A4\n    A4 -->|我方配送| A5\n    A5 --> LG1\n    LG1 --> A6\n    A6 --> S0\n    S0 --> LG2\n    LG2 --> C2\n    A4 -->|客户自提| A6b\n    A6b --> C2\n    C1 --> C2\n    C2 --> C2b\n    C2b --> C3\n    C3 --> C4\n    C4 --> D1\n    D1 --> D2\n    D2 -->|是-下一发货单| C2\n    D2 -->|装货完成| D3\n    D3 --> D4\n    D4 --> D5\n    D5 --> D6\n    D6 -->|是-下一卸货点| D5\n    D6 -->|全部完成| D7\n    D7 --> D8\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<ol>\n<li>ERP 创建销售订单（如按吨计量）。</li>\n<li>OA 做订单备货（订单与备货 1:n）。</li>\n<li>配送方式分支：</li>\n</ol>\n<p>   - 我方配送：OA 发起派车申请（<strong>1车1单</strong>）；</p>\n<p>   - 客户自提：不做派车，直接进入发货通知。</p>\n<ol>\n<li>OA 下推销售发货通知单。</li>\n<li>仓库按通知发货出库（线下/ERP 过账方式：待确认），车辆离厂相关出门手续在 OA/线下办理。</li>\n</ol>","tobeHtml":"<ol>\n<li>ERP 创建销售订单。</li>\n<li><strong>订单备货</strong>在 WMS 下发后，仓管按备货内容<strong>挑选条码并完成备货绑定</strong>。</li>\n<li>配送方式分支：</li>\n</ol>\n<p>   - 我方配送：<strong>WMS 发起派车申请</strong>；审批通过后，由<strong>物流部在 WMS 创建发货单</strong>，<strong>发货单组成运单</strong>。<strong>一个发货单 = 一个装货点 + 一个卸货点</strong>（一车多点则对应多张发货单归入同一运单）；<strong>运单组成后自动生成销售发货通知单</strong>；</p>\n<p>   - 客户自提：跳过派车/发货单/运单；由<strong>销售在 WMS 手动新增销售发货通知单</strong>（门禁与交接方式：待确认）。</p>\n<ol>\n<li>库管根据<strong>销售发货通知单</strong>办理 <strong>销售扫码出库</strong>；若为订单备货物料，须<strong>校验扫码条码与备货绑定条码一致</strong>。</li>\n<li>装卸工在 WMS <strong>完成装卸单登记</strong>。</li>\n<li>在 <strong>WMS 打印出门单</strong>交门卫核对放行。</li>\n<li>仓库办完出库后，由装卸工完成装货，由<strong>司机完成装货确认</strong>；若<strong>多次装货</strong>，则按发货单循环「出库扫码 → 装卸单登记 → 装货确认」直至装货完成。</li>\n<li>司机出门后进入<strong>在途状态</strong>，须<strong>每日在 WMS 更新在途状态信息</strong>。</li>\n<li>司机到达卸货点后，完成<strong>卸货确认</strong>；若<strong>多次卸货</strong>，则按发货单循环卸货确认直至卸货完成。</li>\n<li><strong>所有装货点、卸货点均确认完成后</strong>，运单完成；WMS <strong>推送 ERP 生成采购单（运输费用）</strong>（客户自提无运单则跳过本步）。</li>\n</ol>"},{"id":"s8","title":"场景八：销售退货（自产）","qs":["退货「我方派车提货 / 客户配送」两种方式现场细则是否齐全？","退货运单与销售退货通知单自动生成规则？"],"diagrams":[{"label":"现状（As-Is）","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[OA]:::oa\n        L2[ERP]:::erp\n        L3[线下/人工]:::ma e5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"},{"label":"To-Be","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[ERP]:::erp\n        L2[WMS]:::wms\n        L3[线下/人工]:::manual\n    end\n    subgraph 业务销售[\"业务/销售\"]\n        A1[在ERP创建委外采购订单]:::erp\n        A1b[ERP推送订单至WMS]:::erp\n        A2{配送方式}\n        A3[在WMS发起派车申请]:::wms\n        A5[手动新增委外出库通知单]:::wms\n        A5b[手动新增委外出库通知单]:::wms\n    end\n    subgraph 物流部\n        LG1[对接承运并完成派车申请流程数据]:::wms\n        LG2[组合发货单成运单]:::wms\n    end\n    subgraph 系统自动\n        S0[根据通知单与派车申请<br/>自动生成发货单]:::wms\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        C1[按通知单扫码出库]:::wms\n        C2[在WMS登记装卸单]:::wms\n        C5[WMS推送ERP委外出库过账]:::wms\n        C3[打印出门单]:::wms\n        C4[完成装货]:::manual\n    end\n    subgraph 承运司机[\"承运商/司机\"]\n        D1[装货确认-在途-卸货确认]:::wms\n        D2[运单完成-可选推送运费采购单]:::wms\n    end\n    A1 --> A1b\n    A1b --> A2\n    A2 -->|我方配送| A3\n    A3 --> LG1\n    LG1 --> A5\n    A5 --> S0\n    S0 --> LG2\n    LG2 --> C1\n    A2 -->|三方自提| A5b\n    A5b --> C1\n    C1 --> C2\n    C2 --> C5\n    C5 --> C3\n    C3 --> C4\n    C4 --> D1\n    D1 --> D2\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<ol>\n<li>业务/销售在 ERP 创建<strong>委外采购订单</strong>。</li>\n<li>配送方式分支：</li>\n</ol>\n<p>   - <strong>我方配送</strong>：业务/采购在 OA 发起派车申请 → 物流部安排车辆并审批 → OA 下推<strong>委外出库通知单</strong> → 车辆到厂装车发往三方；</p>\n<p>   - <strong>三方自提</strong>：不走 OA 派车，三方到厂提货。</p>\n<ol>\n<li>仓库按通知/订单在 <strong>ERP 办理委外出库过账</strong>，配合装车；装卸、在途多为线下记录。</li>\n</ol>","tobeHtml":"<ol>\n<li>业务/销售在 ERP 创建委外采购订单，<strong>ERP 推送至 WMS</strong>。</li>\n<li><strong>配送方式分支</strong>：</li>\n</ol>\n<p>   - <strong>我方配送</strong>：业务/销售在 <strong>WMS 发起派车申请</strong> → 物流审批通过后创建发货单并组成运单（<strong>1 发货单 = 1 装货点 + 1 卸货点</strong>）→ <strong>运单自动生成委外出库通知单</strong>；</p>\n<p>   - <strong>三方自提</strong>：跳过派车/发货单/运单；业务/销售在 <strong>WMS 手动新增委外出库通知单</strong>。</p>\n<ol>\n<li>库管/装卸工根据委外出库通知单办理 <strong>扫码出库</strong>；完成后在 WMS <strong>登记装卸单</strong>；WMS <strong>推送 ERP 办理委外出库过账</strong>。</li>\n<li>在 WMS <strong>打印出门单</strong>交门卫放行（路径3 若约定无出门单则跳过）。</li>\n<li>装卸工完成装货，<strong>司机装货确认</strong>；我方配送时司机更新在途、到三方后卸货确认；运单完成后可按需推送 ERP 运费采购单（同场景七）。</li>\n</ol>"},{"id":"s12","title":"场景十二：仓库间调拨","qs":["仓间调拨是否统一走 WMS 出入库并推 ERP 过账？","与场景五转仓单据是否合并或独立？","原辅料/成品/备件调拨分别扫码还是数量？"],"diagrams":[{"label":"现状（As-Is）","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[线下/人工]:::manual\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        A1[仓库间发生实物转移]:::manual\n        A2[不办理出入库-不更新库存账]:::manual\n    end\n    subgraph 物流\n        B1[仅做物流记录-派车装卸或台账]:::manual\n    end\n    A1 --> A2\n    A1 --> B1\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"},{"label":"To-Be","code":"%%{init: {'theme':'base','flowchart':{'htmlLabels':true,'wrappingWidth':140,'nodeSpacing':50,'rankSpacing':55,'padding':12},'themeVariables':{'fontSize':'14px'}}}%%\nflowchart TB\n    subgraph 系统颜色说明\n        direction LR\n        L1[WMS]:::wms\n        L2[ERP]:::erp\n        L3[线下/人工]:::manual\n    end\n    subgraph 业务库管[\"业务/库管\"]\n        A1[在WMS新增调拨申请单]:::wms\n        A2{是否派车}\n        A3[在WMS发起派车申请]:::wms\n        A4[手动新增调拨出库通知]:::wms\n    end\n    subgraph 物流部\n        LG1[对接承运并完成派车申请流程数据]:::wms\n        LG2[组合发货单成运单]:::wms\n    end\n    subgraph 系统自动\n        S0[根据通知单与派车申请<br/>自动生成发货单]:::wms\n    end\n    subgraph 库管装卸[\"库管/装卸工\"]\n        C1[调出仓扫码出库]:::wms\n        C2[登记装卸单-调出]:::wms\n        C3[调入仓扫码入库]:::wms\n        C4[登记装卸单-调入]:::wms\n        C5[WMS推送ERP调拨过账]:::wms\n    end\n    A1 --> A2\n    A2 -->|跨厂区派车| A3\n    A3 --> LG1\n    LG1 --> A4\n    A4 --> S0\n    S0 --> LG2\n    LG2 --> C1\n    A2 -->|厂内短驳不派车| C1\n    C1 --> C2\n    C2 --> C3\n    C3 --> C4\n    C4 --> C5\n    classDef erp fill:#cfe2ff,stroke:#3b82f6;\n    classDef oa fill:#e5e7eb,stroke:#6b7280;\n    classDef wms fill:#d1fae5,stroke:#10b981;\n    classDef lims fill:#ffedd5,stroke:#f97316;\n    classDef manual fill:#ffffff,stroke:#9ca3af;"}],"statusHtml":"<ol>\n<li>仓库间发生实物调拨时，<strong>不走出入库管理、不更新仓库库存账</strong>（ERP/线下库存账往往不随调拨变动）。</li>\n<li>仅保留<strong>物流侧记录</strong>（如派车、装卸、台账或纸质交接），账实易不一致。</li>\n<li>与场景五「生产入库后转仓」不同：转仓已在成品入库链路中过账；本场景指日常仓与仓之间的调拨，现状未纳入同一套出入库。</li>\n</ol>","tobeHtml":"<ol>\n<li>库管（或业务）在 <strong>WMS 新增调拨申请单</strong>（明确调出仓、调入仓、物料/条码）。</li>\n<li><strong>转移方式分支</strong>：</li>\n</ol>\n<p>   - <strong>需派车</strong>（跨厂区/外运）：在 WMS 发起派车申请 → 物流组成运单 → 可自动/关联生成调拨出库通知；</p>\n<p>   - <strong>厂内短驳/不派车</strong>：跳过派车，直接按调拨申请执行。</p>\n<ol>\n<li><strong>调出仓</strong>：库管/装卸工扫码出库（或按数量），并 <strong>登记装卸单</strong>。</li>\n<li><strong>调入仓</strong>：库管/装卸工扫码入库（或按数量），并 <strong>登记装卸单</strong>。</li>\n<li>WMS <strong>推送 ERP 调拨过账</strong>，调出/调入库存账同步更新，与物流记录一致。</li>\n</ol>\n<p>| 待确认 | 说明 |</p>\n<p>| --- | --- |</p>\n<p>| 是否必须推 ERP | 建议推送；若仅 WMS 台账需书面确认 |</p>\n<p>| 与场景五转仓 | 成品入库后转仓是否并入本调拨能力，或保持转仓单据独立 |</p>\n<p>| 条码/数量 | 原辅料、成品是否一律扫码；备品备件是否按批号数量调拨 |</p>"}]</script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

mermaid.initialize({
  startOnLoad: false,
  securityLevel: 'loose',
  theme: 'base',
  themeVariables: {
    fontSize: '14px',
    fontFamily: 'IBM Plex Sans, PingFang SC, Noto Sans SC, sans-serif',
    primaryColor: '#d1fae5',
    primaryBorderColor: '#10b981',
    primaryTextColor: '#064e3b',
    lineColor: '#64748b',
    secondaryColor: '#cfe2ff',
    tertiaryColor: '#f8fafc',
  },
  flowchart: {
    htmlLabels: true,
    curve: 'basis',
    padding: 16,
    nodeSpacing: 55,
    rankSpacing: 60,
    wrappingWidth: 140,
    useMaxWidth: false,
  },
});

const scenes = JSON.parse(document.getElementById('scene-data').textContent);
const nav = document.getElementById('nav');
const content = document.getElementById('content');
const pageTitle = document.getElementById('pageTitle');

const staticPages = [
  { id: 'progress', group: '开篇', label: '项目进度' },
  { id: 'overview', group: '开篇', label: '场景总览' },
  { id: 'problems', group: '收尾', label: '问题清单' },
  { id: 'plan', group: '收尾', label: '后续计划' },
];

function buildNav() {
  let html = '';
  html += `<div class="nav-group">开篇</div>`;
  html += `<button data-page="progress"><span class="idx">01</span><span>项目进度</span></button>`;
  html += `<button data-page="overview"><span class="idx">02</span><span>场景总览</span></button>`;
  html += `<div class="nav-group">入库流程</div>`;
  scenes.slice(0,6).forEach((s,i) => {
    html += `<button data-page="${s.id}"><span class="idx">${String(i+1).padStart(2,'0')}</span><span>${s.title.replace(/^场景/, '')}</span></button>`;
  });
  html += `<div class="nav-group">发货流程</div>`;
  scenes.slice(6).forEach((s,i) => {
    html += `<button data-page="${s.id}"><span class="idx">${String(i+7).padStart(2,'0')}</span><span>${s.title.replace(/^场景/, '')}</span></button>`;
  });
  html += `<div class="nav-group">收尾</div>`;
  html += `<button data-page="problems"><span class="idx">P</span><span>问题清单</span></button>`;
  html += `<button data-page="plan"><span class="idx">N</span><span>后续计划</span></button>`;
  nav.innerHTML = html;
  nav.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.page));
  });
}

function setActive(page) {
  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
}

function renderProgress() {
  pageTitle.textContent = '一、项目进度';
  // 甘特：2026-07-20 ～ 2026-08-21，共 33 天（含起止）
  const origin = new Date(2026, 6, 20); // Jul 20
  const totalDays = 33;
  const dayPct = (d) => (d / totalDays) * 100;
  const offsetDays = (y, m, d) => {
    const t = new Date(y, m - 1, d);
    return Math.round((t - origin) / 86400000);
  };
  const bars = [
    { name: '项目启动', start: offsetDays(2026,7,20), end: offsetDays(2026,7,20), cls: 'done', tip: '7.20' },
    { name: '需求调研', start: offsetDays(2026,7,21), end: offsetDays(2026,7,24), cls: 'done', tip: '7.21～7.24' },
    { name: '蓝图设计', start: offsetDays(2026,7,27), end: offsetDays(2026,8,14), cls: 'doing', tip: '7.27～8.14' },
    { name: '蓝图确认', start: offsetDays(2026,8,17), end: offsetDays(2026,8,21), cls: 'milestone', tip: '8.17～8.21' },
  ];
  const today = new Date();
  today.setHours(0,0,0,0);
  let todayOff = Math.round((today - origin) / 86400000);
  if (todayOff < 0) todayOff = 0;
  if (todayOff > totalDays - 1) todayOff = totalDays - 1;
  const todayLeft = dayPct(todayOff + 0.5);

  const axisTicks = [
    { d: 0, label: '7/20' },
    { d: 4, label: '7/24' },
    { d: 7, label: '7/27' },
    { d: 25, label: '8/14' },
    { d: 28, label: '8/17' },
    { d: 32, label: '8/21' },
  ].map(t => `<span class="gantt-tick" style="left:${dayPct(t.d + 0.5)}%">${t.label}</span>`).join('');

  const rows = bars.map(b => {
    const span = Math.max(1, b.end - b.start + 1);
    const left = dayPct(b.start);
    const width = dayPct(span);

let view = { scale: 1, x: 24, y: 24 };
let currentSvgHtml = '';
let currentDiagLabel = '';
let currentSceneTitle = '';

function bindPanZoom(container, stage, getView, setView) {
  let dragging = false;
  let lastX = 0, lastY = 0;
  const apply = () => {
    const v = getView();
    stage.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.scale})`;
  };
  setView.apply = apply;
  container.onselectstart = (e) => { e.preventDefault(); return false; };
  container.oncopy = (e) => { e.preventDefault(); return false; };
  container.ondragstart = (e) => { e.preventDefault(); return false; };
  container.onpointerdown = (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    window.getSelection()?.removeAllRanges();
    dragging = true;
    container.classList.add('dragging');
    lastX = e.clientX; lastY = e.clientY;
    container.setPointerCapture(e.pointerId);
  };
  container.onpointermove = (e) => {
    if (!dragging) return;
    e.preventDefault();
    window.getSelection()?.removeAllRanges();
    const v = getView();
    v.x += e.clientX - lastX;
    v.y += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    apply();
  };
  const end = () => { dragging = false; container.classList.remove('dragging'); };
  container.onpointerup = end;
  container.onpointercancel = end;
  container.onwheel = (e) => {
    e.preventDefault();
    const v = getView();
    const rect = container.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const prev = v.scale;
    const next = Math.min(3, Math.max(0.25, prev * (e.deltaY < 0 ? 1.1 : 0.9)));
    // zoom toward cursor
    v.x = mx - (mx - v.x) * (next / prev);
    v.y = my - (my - v.y) * (next / prev);
    v.scale = next;
    apply();
  };
  apply();
  return apply;
}

function openFullscreen() {
  const overlay = document.getElementById('fsOverlay');
  const stage = document.getElementById('fsStage');
  const wrap = document.getElementById('fsStageWrap');
  document.getElementById('fsTitle').textContent = `${currentSceneTitle} · ${currentDiagLabel}`;
  stage.innerHTML = `<div class="mermaid">${currentSvgHtml}</div>`;
  stage.querySelectorAll('.cluster rect').forEach((r) => {
    r.setAttribute('stroke', '#334155');
    r.setAttribute('stroke-width', '2.5');
    r.style.stroke = '#334155';
    r.style.strokeWidth = '2.5px';
  });
  const fsView = { scale: Math.max(0.5, view.scale), x: 40, y: 40 };
  const apply = bindPanZoom(wrap, stage, () => fsView, fsView);
  document.getElementById('fsZoomIn').onclick = () => { fsView.scale = Math.min(3, fsView.scale + 0.15); apply(); };
  document.getElementById('fsZoomOut').onclick = () => { fsView.scale = Math.max(0.25, fsView.scale - 0.15); apply(); };
  document.getElementById('fsZoomReset').onclick = () => { fsView.scale = 1; fsView.x = 40; fsView.y = 40; apply(); };
  document.getElementById('fsClose').onclick = closeFullscreen;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}
function closeFullscreen() {
  const overlay = document.getElementById('fsOverlay');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeFullscreen();
});

async function renderScene(scene) {
  pageTitle.textContent = scene.title;
  currentSceneTitle = scene.title;
  content.classList.add('scene-mode');
  const qs = (scene.qs || []).map(q => `<li>${q}</li>`).join('');
  const tabBtns = scene.diagrams.map((d,i) => {
    const isAsis = /As-Is|现状/.test(d.label);
    const cls = isAsis ? 'asis' : 'tobe';
    return `<button class="${i===0?'active ':''}${cls}" data-di="${i}">${d.label}</button>`;
  }).join('');

  content.innerHTML = `
  <div class="card diagram-card">
    <div class="scene-title" style="margin-bottom:10px">
      <span class="badge">${scene.diagrams.length} 张流程图</span>
      <span class="muted">拖拽移动 · 滚轮缩放</span>
    </div>
    <div class="tabs" id="diagTabs">${tabBtns}</div>
    <div class="diagram-toolbar">
      <button type="button" id="zoomOut">缩小</button>
      <button type="button" id="zoomReset">复位</button>
      <button type="button" id="zoomIn">放大</button>
      <button type="button" class="primary" id="btnFullscreen">全屏显示</button>
    </div>
    <div class="diagram-frame" id="diagFrame"><div class="loading">正在渲染流程图…</div></div>
    ${qs ? `<div class="qs" style="margin-top:12px;flex:0 0 auto"><h4>本场景待讨论</h4><ul>${qs}</ul></div>` : ''}
  </div>`;

  view = { scale: 0.85, x: 24, y: 24 };
  const frame = document.getElementById('diagFrame');
  const tabs = document.getElementById('diagTabs');
  let stageEl = null;
  let applyView = () => {};

  async function showDiag(i) {
    tabs.querySelectorAll('button').forEach((b,idx) => b.classList.toggle('active', idx===i));
    const d = scene.diagrams[i];
    currentDiagLabel = d.label;
    frame.innerHTML = `<div class="mermaid-stage" id="mmdStage"><div class="mermaid" id="mmd"></div></div>`;
    stageEl = document.getElementById('mmdStage');
    const el = document.getElementById('mmd');
    try {
      const id = 'm' + Date.now();
      const { svg } = await mermaid.render(id, d.code);
      el.innerHTML = svg;
      currentSvgHtml = svg;
      el.querySelectorAll('.cluster rect').forEach((r) => {
        r.setAttribute('stroke', '#334155');
        r.setAttribute('stroke-width', '2.5');
        r.style.stroke = '#334155';
        r.style.strokeWidth = '2.5px';
      });
      view = { scale: 0.85, x: 24, y: 24 };
      applyView = bindPanZoom(frame, stageEl, () => view, view);
    } catch (e) {
      el.innerHTML = `<pre style="white-space:pre-wrap;color:#b91c1c;padding:16px">${String(e)}</pre>`;
      currentSvgHtml = el.innerHTML;
    }
  }

  tabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => showDiag(+b.dataset.di)));
  document.getElementById('zoomIn').onclick = () => { view.scale = Math.min(3, view.scale + 0.12); applyView(); };
  document.getElementById('zoomOut').onclick = () => { view.scale = Math.max(0.25, view.scale - 0.12); applyView(); };
  document.getElementById('zoomReset').onclick = () => { view.scale = 0.85; view.x = 24; view.y = 24; applyView(); };
  document.getElementById('btnFullscreen').onclick = openFullscreen;
  await showDiag(0);
}

async function navigate(page) {
  setActive(page);
  location.hash = page;
  content.classList.remove('scene-mode');
  closeFullscreen();
  if (page === 'progress') return renderProgress();
  if (page === 'overview') return renderOverview();
  if (page === 'problems') return renderProblems();
  if (page === 'plan') return renderPlan();
  const scene = scenes.find(s => s.id === page);
  if (scene) await renderScene(scene);
}

buildNav();
const initial = (location.hash || '#progress').slice(1);
navigate(scenes.some(s => s.id === initial) || ['progress','overview','problems','plan'].includes(initial) ? initial : 'progress');
</script>
