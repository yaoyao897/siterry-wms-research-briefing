<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>思特瑞 WMS · 原型方案</title>
<style>
:root {
  --bg: #f4f6f9; --panel: #fff; --border: #d8dee8; --text: #1a2332;
  --muted: #5b6b7c; --accent: #2563eb; --accent2: #059669;
  font-family: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text);
  background:
    radial-gradient(900px 420px at 10% 0%, rgba(37,99,235,.08), transparent 55%),
    radial-gradient(700px 360px at 90% 10%, rgba(5,150,105,.07), transparent 50%),
    var(--bg);
  display: flex; align-items: center; justify-content: center; padding: 32px 16px;
}
.wrap { width: min(720px, 100%); }
.back { font-size: 13px; margin-bottom: 16px; }
.back a { color: var(--accent); text-decoration: none; }
.back a:hover { text-decoration: underline; }
h1 { margin: 0 0 8px; font-size: 28px; }
.sub { margin: 0 0 28px; color: var(--muted); font-size: 14px; line-height: 1.6; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }
.card {
  display: block; text-decoration: none; color: inherit;
  background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
  padding: 22px 20px; box-shadow: 0 4px 20px rgba(26,35,50,.08);
  transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
.card:hover { transform: translateY(-2px); border-color: #93c5fd; box-shadow: 0 10px 28px rgba(37,99,235,.12); }
.tag {
  display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em;
  padding: 3px 8px; border-radius: 999px; margin-bottom: 10px;
}
.tag.pc { background: #dbeafe; color: #1e40af; }
.tag.app { background: #d1fae5; color: #065f46; }
.card h2 { margin: 0 0 8px; font-size: 18px; }
.card p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.55; }
.note { margin-top: 18px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="back"><a href="../">← 返回项目总览</a></div>
    <h1>原型方案</h1>
    <p class="sub">可交互 Demo（Mock 数据）。请选择 PC 端或 APP 端查看；页面内右上角也可互相切换。</p>
    <div class="grid">
      <a class="card" href="./pc.html">
        <span class="tag pc">PC</span>
        <h2>PC 端原型</h2>
        <p>基础数据、仓储管理、物流管理等列表 / 表单 / 详情弹窗演示。</p>
      </a>
      <a class="card" href="./app.html">
        <span class="tag app">APP</span>
        <h2>APP 端原型</h2>
        <p>移动端仓储与物流执行页、扫码/盘点、运单在途等演示。</p>
      </a>
    </div>
    <p class="note">需可访问 CDN（unpkg / jsDelivr）。数据均为演示 Mock，无真实接口。</p>
  </div>
</body>
</html>
