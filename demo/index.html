<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思特瑞 WMS · 原型方案导航</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; width: 100%; max-width: 640px; padding: 40px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }
        h1 { font-size: 28px; font-weight: 700; margin-bottom: 12px; color: #38bdf8; }
        p.subtitle { font-size: 15px; color: #94a3b8; margin-bottom: 36px; }
        .btn-group { display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px; }
        @media (min-width: 480px) { .btn-group { flex-direction: row; } }
        .btn { flex: 1; padding: 18px 24px; border-radius: 12px; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; transition: all 0.2s ease; cursor: pointer; }
        .btn-pc { background: #0284c7; color: #ffffff; border: 1px solid #38bdf8; }
        .btn-pc:hover { background: #0369a1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(14, 165, 233, 0.4); }
        .btn-app { background: #059669; color: #ffffff; border: 1px solid #34d399; }
        .btn-app:hover { background: #047857; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.4); }
        .back-link { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #64748b; text-decoration: none; transition: color 0.2s; }
        .back-link:hover { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h1>思特瑞 WMS · 原型方案</h1>
        <p class="subtitle">请选择您需要查看的原型终端 (PC 端 / 移动 APP 端)</p>
        <div class="btn-group">
            <a href="./pc.html" class="btn btn-pc">
                <span>🖥️ 进入 PC 端原型</span>
            </a>
            <a href="./app.html" class="btn btn-app">
                <span>📱 进入 APP 端原型</span>
            </a>
        </div>
        <a href="../" class="back-link">← 返回项目总览说明</a>
    </div>
</body>
</html>
