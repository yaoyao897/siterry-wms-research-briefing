<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>思特瑞 WMS · APP Demo</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<style>
[v-cloak]{display:none}
:root{
  --color-primary:#1A4099;--color-primary-hover:#2B56B0;
  --navy:#1a3a5c;--navy-deep:#0d2137;
  --color-text-main:#262626;--color-text-normal:#595959;--color-text-secondary:#8C8C8C;
  --color-bg-page:#F0F2F5;--color-border:#E8E8E8;--color-success:#52C41A;--color-warning:#FA8C16;
  --el-color-primary:#1A4099;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--color-text-normal);background:var(--color-bg-page)}
#app{height:100vh}
.app-shell{display:flex;height:100vh}
.app-aside{width:240px;flex-shrink:0;height:100%;min-height:0;background:#fff;border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow:hidden}
.app-aside__logo{padding:16px 20px;font-size:15px;font-weight:600;color:var(--color-text-main);border-bottom:1px solid var(--color-border);flex-shrink:0}
.app-aside__scroll{flex:1;min-height:0;overflow:auto}
.app-aside .el-menu{border-right:none;padding:8px 0}
.app-aside .el-menu-item,.app-aside .el-sub-menu__title{height:40px;line-height:40px;margin:2px 8px;border-radius:8px}
.app-aside .el-menu-item.is-active{color:var(--color-primary);background:#F0F4F8;font-weight:500}
.app-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.app-header{height:52px;padding:0 20px;background:#fff;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-header__actions{display:flex;align-items:center;gap:10px;padding-right:88px;flex-shrink:0}
.mode-switch{display:inline-flex;border:1px solid var(--color-border);border-radius:4px;overflow:hidden}
.mode-switch a{padding:6px 14px;font-size:13px;text-decoration:none;color:var(--color-text-normal);background:#fff}
.mode-switch a:hover{color:var(--color-primary)}
.mode-switch a.on{background:var(--color-primary);color:#fff}
.sync-chip{margin-left:8px;height:30px;padding:0 10px;border:1px solid #C5D4EB;border-radius:4px;background:#EEF2F8;color:#1A4099;font-size:12px;cursor:pointer}
.sync-chip:hover{background:#DCE6F5}
.back-overview{
  display:inline-flex;align-items:center;padding:6px 12px;font-size:13px;line-height:1.2;
  border:1px solid var(--color-border);border-radius:4px;background:#fff;
  color:var(--color-text-normal);text-decoration:none;white-space:nowrap;
}
.back-overview:hover{border-color:var(--color-primary);color:var(--color-primary)}
.demo-scope-tip{
  max-width:min(360px,38vw);
  font-size:12px;line-height:1.45;font-weight:600;
  color:#8B0000;text-align:right;
}
.app-body{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;background:#E8ECF0}
.phone-frame{width:390px;height:780px;max-height:calc(100vh - 100px);background:#111;border-radius:28px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);flex-shrink:0}
.phone-screen{width:100%;height:100%;background:#F5F6F8;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone-notch{height:28px;background:#F5F6F8;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.phone-notch span{width:90px;height:6px;background:#ddd;border-radius:3px}

/* APP 页面通用 */
.m-nav{height:44px;display:flex;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;position:relative}
.m-nav__back{border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--color-text-main);padding:4px 8px 4px 0;line-height:1}
.m-nav__title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;color:var(--color-text-main);white-space:nowrap}
.m-nav__right{margin-left:auto;font-size:14px;color:var(--color-primary);cursor:pointer;border:none;background:transparent}
.m-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.m-scroll::-webkit-scrollbar{width:0}
.m-tabbar{height:56px;background:#fff;border-top:1px solid #eee;display:flex;flex-shrink:0}
.m-tabbar__item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#8C8C8C;cursor:pointer;border:none;background:transparent;gap:2px}
.m-tabbar__item.on{color:var(--color-primary);font-weight:500}
.m-tabbar__icon{font-size:18px;line-height:1}
.msg-sub-tab{flex:1;text-align:center;font-size:13px;font-weight:600;color:#8C8C8C;cursor:pointer}
.msg-sub-tab.on{color:var(--color-primary)}
.msg-unread-dot{color:#FA8C16;font-weight:800;margin-left:6px;font-size:12px}

.m-search{margin-bottom:12px}
.m-search input{width:100%;height:36px;border:1px solid #D9D9D9;border-radius:18px;padding:0 14px;font-size:13px;outline:none;background:#fff}
.m-search input:focus{border-color:var(--color-primary)}
.m-group{margin-bottom:16px}
.m-group__title{font-size:13px;font-weight:600;color:var(--color-text-main);margin:0 0 8px 4px}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-mod{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;border:1px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.m-mod:active{background:#EEF2F8}
.m-mod.stub{opacity:.55}
.m-mod.ready{border-color:#C5D4EB}
.m-mod__icon{font-size:22px;line-height:1.2;margin-bottom:6px}
.m-mod__name{font-size:11px;color:var(--color-text-main);line-height:1.3}

.doc-card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.doc-card__hd{height:44px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--navy),var(--navy-deep));color:#fff}
.doc-card__no{font-size:15px;font-weight:600}
.doc-card__bd{padding:12px}
.doc-card__ft{padding:0 12px 12px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.status-tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;-webkit-overflow-scrolling:touch}
.status-tabs::-webkit-scrollbar{display:none}
.status-tab{flex-shrink:0;height:30px;padding:0 12px;border:1px solid var(--color-border);border-radius:15px;background:#fff;color:var(--color-text-normal);font-size:12px;cursor:pointer}
.status-tab.on{background:var(--color-primary);border-color:var(--color-primary);color:#fff;font-weight:600}
.carrier-login{margin:0 12px 10px;padding:8px 10px;border-radius:8px;background:#EEF2F8;color:#1A4099;font-size:12px}
.field select{width:100%;height:40px;border:1px solid var(--color-border);border-radius:8px;padding:0 10px;font-size:14px;background:#fff;color:var(--color-text-main)}
.field select:disabled,.field input:disabled{background:#F5F5F5;color:#8C8C8C}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.doc-grid .full{grid-column:1/-1}
.doc-label{color:#8C8C8C;font-size:12px;margin-right:4px}
.doc-expand{margin-top:10px;padding-top:10px;border-top:1px dashed #E8E8E8}
.doc-mini-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.doc-mini-table th,.doc-mini-table td{border:1px solid #F0F0F0;padding:4px 6px;text-align:left;color:#262626}
.doc-mini-table th{background:#FAFAFA;color:#8C8C8C;font-weight:500}
.tag{display:inline-block;padding:0 8px;height:22px;line-height:20px;font-size:12px;border-radius:4px;border:1px solid transparent}
.tag-b{color:#1A4099;background:#EEF2F8;border-color:#C5D4EB}
.tag-o{color:#FA8C16;background:#FFF7E6;border-color:#FFD591}
.tag-g{color:#52C41A;background:#F6FFED;border-color:#B7EB8F}
.tag-gr{color:#8C8C8C;background:#FAFAFA;border-color:#D9D9D9}

.line-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;cursor:pointer}
.line-card.done{opacity:.5;pointer-events:none}
.line-card__status{position:absolute;top:12px;right:12px}
.line-fields{font-size:13px;padding-right:64px}
.line-fields div{margin-bottom:6px}
.line-fields .k{color:#8C8C8C;font-size:12px;margin-right:4px}
.line-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;text-align:center}
.line-stats .k{display:block;font-size:11px;color:#8C8C8C;margin-bottom:2px}
.line-stats .v{font-size:15px;font-weight:600;color:var(--color-text-main)}
.line-stats .v.zero{color:var(--color-success)}

.info-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.info-card__left{flex:1;min-width:0;font-size:13px}
.info-card__left div{margin-bottom:5px}
.info-card__left .k{color:#8C8C8C;font-size:12px;margin-right:4px}
.info-card__badge{flex-shrink:0;width:72px;align-self:center;padding:10px 6px;text-align:center;background:#EEF2F8;border:1px solid #C5D4EB;border-radius:8px;color:var(--color-primary)}
.info-card__badge .k{display:block;font-size:11px;margin-bottom:4px}
.info-card__badge .v{font-size:22px;font-weight:700;line-height:1}

.sec{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec__title{font-size:13px;font-weight:600;color:var(--color-text-main);margin:0 0 10px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:#8C8C8C;margin-bottom:4px}
.field label .req{color:#FF4D4F;margin-right:2px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid #D9D9D9;border-radius:4px;padding:0 10px;font-size:14px;outline:none;background:#fff}
.field textarea{height:64px;padding:8px 10px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--color-primary)}
.field input[readonly]{background:#FAFAFA;color:#8C8C8C}

.stat-bar{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;padding:0 2px;color:var(--color-text-main)}
.scan-table{width:max-content;min-width:100%;border-collapse:collapse;font-size:12px}
.scan-table th,.scan-table td{padding:8px 10px;border-bottom:1px solid #f0f0f0;text-align:left;white-space:nowrap;vertical-align:middle}
.scan-table th{color:#8C8C8C;font-weight:500;background:#FAFAFA}
.scan-table tr{cursor:default}
.scan-table th.col-op,.scan-table td.col-op{position:sticky;right:0;background:#fff;box-shadow:-4px 0 8px rgba(0,0,0,.04);text-align:center;min-width:64px}
.scan-table th.col-op{background:#FAFAFA;z-index:2}
.scan-table td.col-op{z-index:1}
.scan-link{color:#1A4099;cursor:pointer;text-decoration:none;font-weight:500}
.scan-link.done{color:#52C41A}
.scan-link:active{opacity:.7}
.scan-op-del{border:none;background:transparent;color:#FF4D4F;font-size:12px;padding:4px 8px;cursor:pointer;border-radius:4px}
.scan-op-del:active{background:#FFF1F0}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0;padding-bottom:2px}
.table-scroll::-webkit-scrollbar{height:6px}
.table-scroll::-webkit-scrollbar-thumb{background:#D9D9D9;border-radius:3px}

.process-tabs{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.process-tabs button{flex:1;min-width:72px;height:36px;border:1px solid #D9D9D9;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;color:var(--color-text-normal)}
.process-tabs button.on{border-color:var(--color-primary);color:var(--color-primary);background:#EEF2F8;font-weight:500}
.process-tabs button.done{border-color:#B7EB8F;color:#52C41A;background:#F6FFED}
.process-tabs button.locked{opacity:.45;cursor:not-allowed}

.m-footer{padding:12px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
.btn-primary{width:100%;height:44px;border:none;border-radius:6px;background:var(--color-primary);color:#fff;font-size:16px;font-weight:500;cursor:pointer}
.btn-primary:active{background:var(--color-primary-hover)}
.btn-ghost{
  width:100%;height:44px;border:1px solid var(--color-primary);border-radius:6px;
  background:#fff;color:var(--color-primary);font-size:16px;font-weight:500;cursor:pointer;
}
.btn-ghost:active{background:#EEF2F8}
.btn-sm{height:32px;padding:0 16px;border:none;border-radius:4px;background:var(--color-primary);color:#fff;font-size:13px;cursor:pointer;min-width:72px}
.m-sheet-mask{
  position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;border-radius:20px;overflow:hidden;
}
.m-sheet{
  width:100%;max-height:72%;background:#fff;border-radius:16px 16px 0 0;
  display:flex;flex-direction:column;box-shadow:0 -4px 20px rgba(0,0,0,.12);
}
.m-sheet__hd{
  flex-shrink:0;padding:14px 16px;font-weight:600;font-size:15px;
  border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;
}
.m-sheet__close{border:none;background:transparent;font-size:20px;line-height:1;color:#8C8C8C;cursor:pointer;padding:0 4px}
.m-sheet__body{flex:1;min-height:0;overflow:auto;padding:12px}
.m-sheet__item{cursor:pointer}
.m-sheet__item:active{background:#F5F8FC}
.m-sheet__item.is-disabled{opacity:.45;pointer-events:none}
.btn-sm.is-off{opacity:.45;pointer-events:none;background:#BFBFBF}
.btn-sm.is-dim{opacity:.45}
.btn-sm.btn-sign{background:#389E0D}
.photo-row{display:flex;gap:8px;flex-wrap:wrap}
.photo-thumb{width:64px;height:64px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#8C8C8C;text-align:center;padding:4px;background:#FAFAFA}
.qty-diff{color:#FF4D4F;font-size:12px;margin-top:4px}
.sign-pad{height:72px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#8C8C8C;background:#FAFAFA;cursor:pointer;font-style:italic}
.sign-pad.on{border-color:#52C41A;color:#389E0D;background:#F6FFED;font-style:normal;font-weight:600}
.enroute-mini{background:#fff;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;box-shadow:0 1px 4px rgba(0,0,0,.05)}

.stub-page{padding:40px 24px;text-align:center;color:#8C8C8C}
.stub-page h3{color:var(--color-text-main);margin:0 0 8px}
.empty{padding:48px 16px;text-align:center;color:#BFBFBF;font-size:13px}
.hint{font-size:12px;color:#8C8C8C;margin:0 0 8px 4px}

.proc-block{margin-bottom:14px}
.proc-block label{display:block;font-size:12px;color:#8C8C8C;margin-bottom:4px}
.sub-card{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;background:#FAFAFA}
.sub-card__hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13px;color:var(--color-text-main)}
.upload-box{width:64px;height:64px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#BFBFBF;cursor:pointer;background:#fff}
.proc-row{background:#fff;border:1px solid #F0F0F0;border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.proc-row.done{opacity:.85}
.proc-row.locked{opacity:.45;pointer-events:none}
.proc-row__hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.proc-row__sum{font-size:12px;color:#8C8C8C;line-height:1.4}

.sign-box{height:80px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#BFBFBF;background:#fff;cursor:pointer;font-size:13px}

/* 页面 PRD 备注：右侧面板无遮罩、挤压主区 */
:root{--remarks-panel-w:520px;--color-btn-primary:#1A4099;--color-btn-link:#1A4099}
.remarks-toggle{
  position:fixed;top:10px;right:16px;z-index:10050;
  height:32px;min-width:72px;padding:0 14px;
  border:1px solid var(--color-border);border-radius:4px;
  background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);
  color:var(--color-text-normal);font-size:13px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;
}
.remarks-toggle:hover{border-color:var(--color-primary);color:var(--color-primary)}
.remarks-toggle.on{color:#fff!important;background:var(--color-primary)!important;border-color:var(--color-primary)!important}
body.remarks-open .remarks-toggle{right:calc(var(--remarks-panel-w) + 16px);min-width:88px}
.remarks-drawer{
  position:fixed;top:0;right:0;bottom:0;width:var(--remarks-panel-w);z-index:10040;
  background:#fff;border-left:1px solid var(--color-border);
  box-shadow:-4px 0 16px rgba(0,0,0,.08);
  display:flex;flex-direction:column;transform:translateX(100%);
  transition:transform .2s ease;
}
.remarks-drawer.is-open{transform:translateX(0)}
.remarks-drawer__hd{
  flex-shrink:0;height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--color-border);background:#FAFAFA;
}
.remarks-drawer__title{font-size:14px;font-weight:600;color:var(--color-text-main);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.remarks-drawer__close{
  width:28px;height:28px;border:none;border-radius:4px;background:transparent;
  color:var(--color-text-secondary);font-size:18px;line-height:1;cursor:pointer;
}
.remarks-drawer__close:hover{background:rgba(0,0,0,.06);color:var(--color-text-main)}
.remarks-drawer__content{flex:1;min-height:0;display:flex;align-items:stretch}
.remarks-drawer__body{flex:1;min-width:0;overflow:auto;padding:14px 14px 24px 16px}
.remarks-drawer__toc{
  flex:0 0 118px;width:118px;border-left:1px solid var(--color-border);
  background:#FAFBFC;padding:10px 0 16px;overflow:auto;
}
.remarks-drawer__toc-title{padding:0 10px 8px;font-size:11px;font-weight:600;color:var(--color-text-secondary)}
.remarks-drawer__toc-item{
  display:block;width:100%;padding:5px 10px;border:none;border-left:2px solid transparent;
  background:transparent;text-align:left;font-size:11px;line-height:1.35;
  color:var(--color-text-normal);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.remarks-drawer__toc-item:hover{color:var(--color-primary);background:#F0F4FA}
.remarks-drawer__toc-item.is-active{color:var(--color-primary);font-weight:600;border-left-color:var(--color-primary);background:#EEF2F8}
.remarks-drawer__toc-item.is-l1{font-weight:600}
.remarks-drawer__toc-item.is-l3{padding-left:16px;font-size:10px;color:var(--color-text-secondary)}
.remarks-md{margin:0;font-size:13px;line-height:1.7;color:var(--color-text-normal);white-space:pre-wrap;word-break:break-word;font-family:inherit}
.remarks-md strong{color:var(--color-text-main);font-weight:600}
.remarks-md__h{margin:12px 0 8px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--color-primary);background:#EEF2F8;border-radius:4px}
.remarks-md__h:first-child{margin-top:0}
.remarks-md__h3{margin:10px 0 6px;font-size:13px;font-weight:600;color:var(--color-text-main)}
.remarks-empty{padding:24px 8px;text-align:center;color:var(--color-text-secondary);font-size:13px;line-height:1.6}
body.remarks-open #app{width:calc(100% - var(--remarks-panel-w));max-width:calc(100% - var(--remarks-panel-w))}
body.remarks-open .demo-scope-tip{display:none}
@media (max-width:900px){
  :root{--remarks-panel-w:min(100vw,420px)}
}
</style>
</head>
<body>
<div id="app" v-cloak>
  <button type="button" class="remarks-toggle" :class="{ on: remarksOpen }" @click="toggleRemarks" title="查看本页页面说明">
    {{ remarksOpen ? '收起备注' : '备注' }}
  </button>
  <aside class="remarks-drawer" :class="{ 'is-open': remarksOpen }" aria-label="页面说明">
    <div class="remarks-drawer__hd">
      <span class="remarks-drawer__title">{{ remarksTitle }}</span>
      <button type="button" class="remarks-drawer__close" @click="closeRemarks" aria-label="关闭">×</button>
    </div>
    <div class="remarks-drawer__content">
      <div ref="remarksBodyRef" class="remarks-drawer__body">

    function inlineRemarksFormat(escText) {

    function renderRemarksMarkdown(src) {
      const raw = String(src == null ? '' : src);

      let hIdx = 0;
      const out = raw.split('\n').map((line) => {
        const hm = /^(#{1,3})\s+(.+)$/.exec(line);

          const level = hm[1].length;
          const plain = String(hm[2] || '').trim();
          const id = 'rm-h-' + (hIdx++);
          toc.push({ id, level, text: plain.replace(/\*\*/g, '') });
          const esc = plain.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          const cls = level >= 3 ? 'remarks-md__h3' : 'remarks-md__h';
          return `<div class="${cls}" id="${id}" data-rm-level="${level}">${inlineRemarksFormat(esc)}</div>`;
        }
        const esc = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return inlineRemarksFormat(esc);
      });
      return { html: out.join('\n'), toc };
    }

      'po-in-form': ['新增编辑页', '新增编辑'],

    function normalizeRemarksLabel(s) {

        .replace(/\s+/g, '')

        docs: '单据页', materials: '物料明细页', exec: '执行页', process: '工序页',

    function findRemarksViewAnchor(viewName) {
      const toc = remarksToc.value || [];
      const keys = remarksKeysForView(viewName);
      if (!toc.length || !keys.length) return null;
      const score = (text) => {
        const cleaned = String(text || '').trim();
        const nt = normalizeRemarksLabel(cleaned);
        let best = 0;
        keys.forEach((k) => {
          const nk = normalizeRemarksLabel(k);
          if (!nk) return;
          if (cleaned === k || nt === nk) best = Math.max(best, 4);
          else if (nt.startsWith(nk) || nk.startsWith(nt)) best = Math.max(best, 3);
          else if (nt.includes(nk) || nk.includes(nt)) best = Math.max(best, 2);
          else if (cleaned.includes(k) || k.includes(cleaned)) best = Math.max(best, 1);
        });
        // 优先匹配「页面 N：…」一级分区标题
        if (best > 0 && /^页面\s*\d+/i.test(cleaned)) best += 2;
        return best;
      };
      let best = null;
      let bestScore = 0;
      toc.forEach((item) => {
        const s = score(item.text);
        if (s > bestScore) {
          bestScore = s;
          best = item;
        }
      });
      return bestScore > 0 ? best : null;

      const prefix = 'SCLCK' + todayYmd().replace(/-/g, '');
      let maxSeq = 9000;
      const consider = (id) => {
        const s = String(id || '');
        if (!s.startsWith(prefix)) return;
        const n = Number(s.slice(prefix.length));
        if (Number.isFinite(n) && n > maxSeq) maxSeq = n;
      };
      if (STORE && typeof STORE.load === 'function') {

      return prefix + String(maxSeq + 1).padStart(4, '0');

    function fifoDeductCountInv(code, lot, qty) {
      const rows = listDirectPickInv(code, lot)
        .filter(r => Number(r.qty) > 0)
        .slice()
        .sort((a, b) => String(a.inDate || '').localeCompare(String(b.inDate || '')));
      const took = [];
      let left = Number(qty);
      rows.forEach((r) => {
        if (left <= 0) return;
        const avail = Number(r.qty || 0);
        const take = Math.min(avail, left);
        r.qty = avail - take;
        left -= take;
        took.push({ loc: r.loc, qty: take, unit: r.unit || '个', inDate: r.inDate });
      });
      return { took, left };

    /**
     * 委外退料流水码双模式流转：
     * 初始化码 → 库存状态置「仓库」且当前数量直接赋值本次退料数量；
     * 仓库在库码 → 当前数量在原在库数量上累加本次退料数量。
     */
    function applyOsRetBarcodeArchive(final) {
      const archRows = CFG.serialArchRows || [];
      const noticeId = (currentNotice.value && currentNotice.value.id) || '';
      scanRows.value.forEach((r) => {
        const arch = archRows.find(a => a.barcode === r.barcode);
        if (!arch) return;
        if (!final) {
          arch.step = '委外退料-执行中';
          return;
        }
        const retQty = Number(r.qty || 0);
        const wasInStock = String(r.srcStockStatus || arch.stockStatus || '') === '仓库';
        const nextQty = wasInStock ? Number(r.srcQty || arch.qty || 0) + retQty : retQty;
        arch.qty = String(nextQty);
        arch.stockStatus = '仓库';
        arch.loc = r.loc || form.loc || arch.loc;
        arch.sourceNo = noticeId || arch.sourceNo;
        arch.stage = '委外退料';
        arch.step = '';
        if (r.outer && r.outer !== '—') {
          arch.bindStatus = '已绑定';
          arch.bindOuter = r.outer;
        }
      });
    }

        ElementPlus.ElMessageBox.confirm(tip, '提交确认', {
          confirmButtonText: '确认提交', cancelButtonText: '返回检查', type: 'warning',
        }).then(() => {
          const n = currentNotice.value;
          const line = currentLine.value;
          if (line) {
            line.doneQty = Number(line.doneQty || 0) + qty;
            line.remainQty = Math.max(0, Number(line.remainQty || 0) - qty);
            line.remainPcs = 0;
            line.status = line.remainQty === 0 ? '已完成' : '执行中';
          }
          if (n) {
            const allDone = (n.lines || []).every(ln => ln.status === '已完成' || ln.status === '已关闭');
            n.status = allDone ? '已完成' : '执行中';
          }

              name: line.name || '',

              loc: form.loc,

          if (n && n.status === '已完成') view.value = 'docs';

          confirmButtonText: '确认提交', cancelButtonText: '返回检查', type: 'warning',

          const n = currentNotice.value;

            if (line.remainQty === 0) {
              line.status = '已完成';
            } else {

            }

          const name = processTab.value;
          const ref = processRef.value;
          const isBatch = String(ref).includes('批量');
          let touched = 0;
          scanRows.value.forEach((r) => {
            if (!isBatch && r.barcode !== ref && !String(ref).includes(r.barcode)) return;
            if (!poInRowProcUnlocked(r, name)) return;
            r.doneProcs = r.doneProcs || [];
            if (!r.doneProcs.includes(name)) r.doneProcs.push(name);
            refreshPoInRowDone(r);
            touched += 1;
          });
          if (!touched) {
            ElementPlus.ElMessage.error('没有可完成该工序的条码，请确认前置工序已完成');
            return;
          }
          ElementPlus.ElMessage.success(isBatch ? `工序「${name}」批量执行完成（${touched} 条）` : '工序表单提交成功');
          view.value = 'exec';
          return;
        }
        if ((isInCountDoc.value || isOutCountDoc.value) && poInHasCraft.value) {
          const name = processTab.value;
          if (!countProcUnlocked(name)) {
            ElementPlus.ElMessage.error('请先完成前置工序');
            return;
          }
          if (!countDoneProcs.value.includes(name)) countDoneProcs.value.push(name);
          ElementPlus.ElMessage.success('工序执行提交成功');
          view.value = 'exec';
          return;
        }
        if (isInTankDoc.value) {
          const ref = processRef.value;
          const isBatch = String(ref).includes('批量');
          tankRows.value.forEach((r) => {
            if (isBatch || r.barcode === ref || r.tankNo === ref || String(ref).includes(r.barcode)) {
              r.done = true;
            }
          });
          ElementPlus.ElMessage.success(isBatch ? '工序批量执行完成' : '工序表单提交成功');
          view.value = 'exec';
          return;
        }
        if (isLineSidePick.value) {
          const ref = processRef.value;
          scanRows.value.forEach(r => {
            if (ref.includes('批量')) {
              if (r.process === processTab.value) r.done = true;
            } else if (r.barcode === ref || String(ref).includes(r.barcode)) {
              r.done = true;
            }
          });
        }
        if (flowMode.value === 'pkg-doc') {
          const ref = processRef.value;
          pkgRows.value.forEach(r => {
            if (String(ref).includes('批量') || r.barcode === ref) r.process = processTab.value;
          });

        if (wayBackView.value === 'waybill-pickup' || wayBackView.value === 'waybill-sign' || wayBackView.value === 'waybill-enroute') {
          const list = wayBackView.value === 'waybill-enroute' ? enrouteProcs.value : (wayPoint.value.procs || []);
          const hit = list.find(p => p.name === processTab.value);
          if (hit) { hit.status = '已完成'; hit.user = operator; hit.time = '15:00'; }
        }
        if (isLoadFlow.value && currentLine.value && currentLine.value.procs) {
          const hit = currentLine.value.procs.find(p => p.name === processTab.value);
          if (hit) { hit.status = '已完成'; hit.summary = '✓ 已填写提交'; }
          if (currentLine.value.status === '待执行') currentLine.value.status = '执行中';
        }
        ElementPlus.ElMessage.success(isLineSidePick.value ? '当前条码工序执行完成' : '工序表单提交成功');

          view.value = wayBackView.value;
        } else {
          view.value = 'exec';
        }
      }).catch(() => {});
