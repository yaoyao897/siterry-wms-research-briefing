<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>思特瑞 WMS · APP Demo</title>
<link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
<style>
[v-cloak]{display:none}
:root{
  --color-primary:#1A4099;--color-primary-hover:#2B56B0;
  --navy:#1a3a5c;--navy-deep:#0d2137;
  --color-text-main:#262626;--color-text-normal:#595959;--color-text-secondary:#8C8C8C;
  --color-bg-page:#F0F2F5;--color-border:#E8E8E8;--color-success:#52C41A;--color-warning:#FA8C16;
  --el-color-primary:#1A4099;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:14px;color:var(--color-text-normal);background:var(--color-bg-page)}
#app{height:100vh}
.app-shell{display:flex;height:100vh}
.app-aside{width:240px;flex-shrink:0;height:100%;min-height:0;background:#fff;border-right:1px solid var(--color-border);display:flex;flex-direction:column;overflow:hidden}
.app-aside__logo{padding:16px 20px;font-size:15px;font-weight:600;color:var(--color-text-main);border-bottom:1px solid var(--color-border);flex-shrink:0}
.app-aside__scroll{flex:1;min-height:0;overflow:auto}
.app-aside .el-menu{border-right:none;padding:8px 0}
.app-aside .el-menu-item,.app-aside .el-sub-menu__title{height:40px;line-height:40px;margin:2px 8px;border-radius:8px}
.app-aside .el-menu-item.is-active{color:var(--color-primary);background:#F0F4F8;font-weight:500}
.app-main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
.app-header{height:52px;padding:0 20px;background:#fff;border-bottom:1px solid var(--color-border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-header__actions{display:flex;align-items:center;gap:10px}
.mode-switch{display:inline-flex;border:1px solid var(--color-border);border-radius:4px;overflow:hidden}
.mode-switch a{padding:6px 14px;font-size:13px;text-decoration:none;color:var(--color-text-normal);background:#fff}
.mode-switch a:hover{color:var(--color-primary)}
.mode-switch a.on{background:var(--color-primary);color:#fff}
.app-body{flex:1;min-height:0;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;background:#E8ECF0}
.phone-frame{width:390px;height:780px;max-height:calc(100vh - 100px);background:#111;border-radius:28px;padding:12px;box-shadow:0 12px 40px rgba(0,0,0,.25);flex-shrink:0}
.phone-screen{width:100%;height:100%;background:#F5F6F8;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.phone-notch{height:28px;background:#F5F6F8;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.phone-notch span{width:90px;height:6px;background:#ddd;border-radius:3px}

/* APP 页面通用 */
.m-nav{height:44px;display:flex;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid #eee;flex-shrink:0;position:relative}
.m-nav__back{border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--color-text-main);padding:4px 8px 4px 0;line-height:1}
.m-nav__title{position:absolute;left:50%;transform:translateX(-50%);font-size:16px;font-weight:600;color:var(--color-text-main);white-space:nowrap}
.m-nav__right{margin-left:auto;font-size:14px;color:var(--color-primary);cursor:pointer;border:none;background:transparent}
.m-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.m-scroll::-webkit-scrollbar{width:0}
.m-tabbar{height:56px;background:#fff;border-top:1px solid #eee;display:flex;flex-shrink:0}
.m-tabbar__item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:#8C8C8C;cursor:pointer;border:none;background:transparent;gap:2px}
.m-tabbar__item.on{color:var(--color-primary);font-weight:500}
.m-tabbar__icon{font-size:18px;line-height:1}

.m-search{margin-bottom:12px}
.m-search input{width:100%;height:36px;border:1px solid #D9D9D9;border-radius:18px;padding:0 14px;font-size:13px;outline:none;background:#fff}
.m-search input:focus{border-color:var(--color-primary)}
.m-group{margin-bottom:16px}
.m-group__title{font-size:13px;font-weight:600;color:var(--color-text-main);margin:0 0 8px 4px}
.m-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m-mod{background:#fff;border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;border:1px solid transparent;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.m-mod:active{background:#EEF2F8}
.m-mod.stub{opacity:.55}
.m-mod.ready{border-color:#C5D4EB}
.m-mod__icon{font-size:22px;line-height:1.2;margin-bottom:6px}
.m-mod__name{font-size:11px;color:var(--color-text-main);line-height:1.3}

.doc-card{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.doc-card__hd{height:44px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,var(--navy),var(--navy-deep));color:#fff}
.doc-card__no{font-size:15px;font-weight:600}
.doc-card__bd{padding:12px}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;font-size:13px}
.doc-grid .full{grid-column:1/-1}
.doc-label{color:#8C8C8C;font-size:12px;margin-right:4px}
.doc-card__ft{padding:0 12px 12px;display:flex;justify-content:flex-end}
.tag{display:inline-block;padding:0 8px;height:22px;line-height:20px;font-size:12px;border-radius:4px;border:1px solid transparent}
.tag-b{color:#1A4099;background:#EEF2F8;border-color:#C5D4EB}
.tag-o{color:#FA8C16;background:#FFF7E6;border-color:#FFD591}
.tag-g{color:#52C41A;background:#F6FFED;border-color:#B7EB8F}
.tag-gr{color:#8C8C8C;background:#FAFAFA;border-color:#D9D9D9}

.line-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);position:relative;cursor:pointer}
.line-card.done{opacity:.5;pointer-events:none}
.line-card__status{position:absolute;top:12px;right:12px}
.line-fields{font-size:13px;padding-right:64px}
.line-fields div{margin-bottom:6px}
.line-fields .k{color:#8C8C8C;font-size:12px;margin-right:4px}
.line-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;padding-top:10px;border-top:1px solid #f0f0f0;text-align:center}
.line-stats .k{display:block;font-size:11px;color:#8C8C8C;margin-bottom:2px}
.line-stats .v{font-size:15px;font-weight:600;color:var(--color-text-main)}
.line-stats .v.zero{color:var(--color-success)}

.info-card{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;display:flex;gap:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.info-card__left{flex:1;min-width:0;font-size:13px}
.info-card__left div{margin-bottom:5px}
.info-card__left .k{color:#8C8C8C;font-size:12px;margin-right:4px}
.info-card__badge{flex-shrink:0;width:72px;align-self:center;padding:10px 6px;text-align:center;background:#EEF2F8;border:1px solid #C5D4EB;border-radius:8px;color:var(--color-primary)}
.info-card__badge .k{display:block;font-size:11px;margin-bottom:4px}
.info-card__badge .v{font-size:22px;font-weight:700;line-height:1}

.sec{background:#fff;border-radius:10px;padding:12px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.sec__title{font-size:13px;font-weight:600;color:var(--color-text-main);margin:0 0 10px}
.field{margin-bottom:10px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:#8C8C8C;margin-bottom:4px}
.field label .req{color:#FF4D4F;margin-right:2px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid #D9D9D9;border-radius:4px;padding:0 10px;font-size:14px;outline:none;background:#fff}
.field textarea{height:64px;padding:8px 10px;resize:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--color-primary)}
.field input[readonly]{background:#FAFAFA;color:#8C8C8C}

.stat-bar{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;padding:0 2px;color:var(--color-text-main)}
.scan-table{width:100%;border-collapse:collapse;font-size:12px}
.scan-table th,.scan-table td{padding:8px 6px;border-bottom:1px solid #f0f0f0;text-align:left;white-space:nowrap}
.scan-table th{color:#8C8C8C;font-weight:500;background:#FAFAFA}
.scan-table tr{cursor:pointer}
.scan-table tr:active td{background:#EEF2F8}
.table-scroll{overflow-x:auto;margin:0 -4px}

.process-tabs{display:flex;gap:8px;margin-bottom:4px}
.process-tabs button{flex:1;height:36px;border:1px solid #D9D9D9;border-radius:4px;background:#fff;font-size:13px;cursor:pointer;color:var(--color-text-normal)}
.process-tabs button.on{border-color:var(--color-primary);color:var(--color-primary);background:#EEF2F8;font-weight:500}

.m-footer{padding:12px;background:#fff;border-top:1px solid #eee;flex-shrink:0}
.btn-primary{width:100%;height:44px;border:none;border-radius:6px;background:var(--color-primary);color:#fff;font-size:16px;font-weight:500;cursor:pointer}
.btn-primary:active{background:var(--color-primary-hover)}
.btn-sm{height:32px;padding:0 16px;border:none;border-radius:4px;background:var(--color-primary);color:#fff;font-size:13px;cursor:pointer}

.stub-page{padding:40px 24px;text-align:center;color:#8C8C8C}
.stub-page h3{color:var(--color-text-main);margin:0 0 8px}
.empty{padding:48px 16px;text-align:center;color:#BFBFBF;font-size:13px}
.hint{font-size:12px;color:#8C8C8C;margin:0 0 8px 4px}

.proc-block{margin-bottom:14px}
.proc-block label{display:block;font-size:12px;color:#8C8C8C;margin-bottom:4px}
.sub-card{border:1px solid #eee;border-radius:8px;padding:10px;margin-bottom:8px;background:#FAFAFA}
.sub-card__hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:13px;color:var(--color-text-main)}
.upload-box{width:64px;height:64px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:#BFBFBF;cursor:pointer;background:#fff}
.proc-row{background:#fff;border:1px solid #F0F0F0;border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer}
.proc-row.done{opacity:.85}
.proc-row.locked{opacity:.45;pointer-events:none}
.proc-row__hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.proc-row__sum{font-size:12px;color:#8C8C8C;line-height:1.4}

.sign-box{height:80px;border:1px dashed #D9D9D9;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#BFBFBF;background:#fff;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="app" v-cloak>
  <div class="app-shell">
    <aside class="app-aside">
      <div class="app-aside__logo">思特瑞 WMS · APP</div>
      <div class="app-aside__scroll">
        <el-menu :default-active="menuActive" :default-openeds="defaultOpeneds" @select="onMenuSelect">
          <template v-for="m1 in menu" :key="m1.index">
            <el-sub-menu v-if="m1.children" :index="m1.index">
              <template #title>{{ m1.title }}</template>
              <template v-for="m2 in m1.children" :key="m2.index">
                <el-sub-menu v-if="m2.children" :index="m2.index">
                  <template #title>{{ m2.title }}</template>
                  <el-menu-item v-for="leaf in m2.children" :key="leaf.index" :index="leaf.index">{{ leaf.title }}</el-menu-item>
                </el-sub-menu>
                <el-menu-item v-else :index="m2.index">{{ m2.title }}</el-menu-item>
              </template>
            </el-sub-menu>
          </template>
        </el-menu>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div style="font-size:13px;color:#8C8C8C">{{ headerHint }}</div>
        <div class="app-header__actions">
          <div class="mode-switch">
            <a href="./pc.html">PC</a>
            <a href="./app.html" class="on">APP</a>
          </div>
        </div>
      </header>

      <div class="app-body">
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch"><span></span></div>

            <!-- ===== 首页 ===== -->
            <template v-if="view==='home'">
              <div class="m-nav"><div class="m-nav__title">思特瑞 WMS</div></div>
              <div class="m-scroll">
                <div class="m-search"><input v-model="homeKw" placeholder="搜索模块名称…" /></div>
                <div v-for="g in filteredHome" :key="g.group" class="m-group">
                  <div class="m-group__title">{{ g.group }}</div>
                  <div class="m-grid">
                    <div
                      v-for="it in g.items" :key="it.id"
                      class="m-mod" :class="{ stub: it.stub, ready: it.ready }"
                      @click="openModule(it)"
                    >
                      <div class="m-mod__icon">{{ it.icon }}</div>
                      <div class="m-mod__name">{{ it.name }}</div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="m-tabbar">
                <button class="m-tabbar__item on"><span class="m-tabbar__icon">🏠</span>首页</button>
                <button class="m-tabbar__item" @click="openStub('消息')"><span class="m-tabbar__icon">💬</span>消息</button>
                <button class="m-tabbar__item" @click="openStub('我的')"><span class="m-tabbar__icon">👤</span>我的</button>
              </div>
            </template>

            <!-- ===== 单据页 ===== -->
            <template v-else-if="view==='docs'">
              <div class="m-nav">
                <button class="m-nav__back" @click="goHome">←</button>
                <div class="m-nav__title">{{ flowTitle }}</div>
                <button v-if="flowMeta.showDocAdd !== false && flowMode!=='waybill'" class="m-nav__right" @click="toast('新增单据（Demo）')">新增</button>
              </div>
              <div class="m-scroll">
                <div class="m-search"><input v-model="docKw" :placeholder="flowMeta.searchHint || '模糊搜索…'" /></div>
                <p v-if="docKw" class="hint">找到 {{ filteredNotices.length }} 张匹配{{ isLoadFlow ? '装卸单' : '单据' }}</p>
                <div v-if="!filteredNotices.length" class="empty">{{ flowMeta.emptyDocs || '暂无待执行单据' }}</div>
                <div v-for="n in filteredNotices" :key="n.id" class="doc-card">
                  <div class="doc-card__hd">
                    <span class="doc-card__no">{{ n.id }}</span>
                    <span class="tag" :class="statusTag(n.status)">{{ n.status }}</span>
                  </div>
                  <div class="doc-card__bd">
                    <div class="doc-grid" v-if="flowMode==='waybill'">
                      <div class="full"><span class="doc-label">关联派车单</span>{{ n.dispatchNo }}</div>
                      <div><span class="doc-label">配送方式</span>{{ n.shipMode }}</div>
                      <div><span class="doc-label">司机</span>{{ n.driver }} / {{ n.plate }}</div>
                      <div class="full"><span class="doc-label">计划装车</span>{{ n.planLoad }}</div>
                      <div class="full"><span class="doc-label">装卸货点</span>{{ n.route }}</div>
                    </div>
                    <div class="doc-grid" v-else-if="isLoadFlow">
                      <div><span class="doc-label">单据类型</span>{{ n.docType }}</div>
                      <div><span class="doc-label">计划执行</span>{{ n.planDate }}</div>
                      <div class="full"><span class="doc-label">物料信息</span>{{ n.materialSummary }}</div>
                      <div class="full"><span class="doc-label">装卸区域</span>{{ n.loadArea || n.partner }}</div>
                      <div class="full"><span class="doc-label">计划件数/数量</span>{{ n.planPcs }}件 / {{ n.planQty }} {{ n.planUnit || '' }}</div>
                    </div>
                    <div class="doc-grid" v-else-if="flowMode==='stocktake'">
                      <div><span class="doc-label">盘点类型</span>{{ n.refNo || n.docType }}</div>
                      <div><span class="doc-label">盘点方式</span>{{ n.takeMode || '条码盘点' }}</div>
                      <div class="full"><span class="doc-label">盘点仓库</span>{{ n.partner }}</div>
                      <div class="full"><span class="doc-label">计划开始时间</span>{{ n.planStart || n.planDate }}</div>
                      <div class="full"><span class="doc-label">备注</span>{{ n.remark || '—' }}</div>
                      <div><span class="doc-label">制单人</span>{{ n.creator || '—' }}</div>
                      <div><span class="doc-label">制单时间</span>{{ n.createTime || '—' }}</div>
                    </div>
                    <div class="doc-grid" v-else-if="flowMode==='pkg-doc'">
                      <div><span class="doc-label">单据类型</span>{{ n.docType }}</div>
                      <div><span class="doc-label">{{ flowMeta.partnerLabel || '产线名称' }}</span>{{ n.partner }}</div>
                      <div><span class="doc-label">{{ flowMeta.refLabel || '车间名称' }}</span>{{ n.refNo }}</div>
                      <div><span class="doc-label">工艺</span>{{ n.materialSummary }}</div>
                      <div class="full"><span class="doc-label">计划件数</span>{{ n.planPcs }} 件</div>
                    </div>
                    <div class="doc-grid" v-else>
                      <div><span class="doc-label">{{ flowMeta.partnerLabel || '往来单位' }}</span>{{ n.partner || n.supplier }}</div>
                      <div><span class="doc-label">计划日期</span>{{ n.planDate }}</div>
                      <div><span class="doc-label">{{ flowMeta.refLabel || '关联单据' }}</span>{{ n.refNo || n.poNo || '—' }}</div>
                      <div><span class="doc-label">单据类型</span>{{ n.docType }}</div>
                      <div class="full"><span class="doc-label">物料</span>{{ n.materialSummary }}</div>
                      <div v-if="n.dispatchNo" class="full"><span class="doc-label">关联派车申请单</span>{{ n.dispatchNo }}</div>
                    </div>
                  </div>
                  <div class="line-stats" v-if="flowMode==='stocktake'" style="margin:0 12px 12px;border-top:1px solid #F0F0F0;padding-top:10px">
                    <div><span class="k">应盘件数</span><span class="v">{{ n.planPcs ?? 0 }}</span></div>
                    <div><span class="k">实盘件数</span><span class="v">{{ n.donePcs ?? 0 }}</span></div>
                    <div><span class="k">待盘件数</span><span class="v" :class="{ zero: (n.pendingPcs||0)===0 }">{{ n.pendingPcs ?? 0 }}</span></div>
                  </div>
                  <div class="doc-card__ft" style="gap:8px">
                    <button v-if="flowMode==='stocktake'" class="btn-sm" @click="openStockExec(n)">执行 ›</button>
                    <button v-else class="btn-sm" @click="openDocAction(n)">执行</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- ===== 物料明细页 ===== -->
            <template v-else-if="view==='materials'">
              <div class="m-nav">
                <button class="m-nav__back" @click="view='docs'">←</button>
                <div class="m-nav__title">{{ flowTitle }}</div>
              </div>
              <div class="m-scroll">
                <div class="m-group__title">基本信息</div>
                <div class="doc-card" style="margin-bottom:16px">
                  <div class="doc-card__hd">
                    <span class="doc-card__no">{{ currentNotice.id }}</span>
                    <span class="tag" :class="statusTag(currentNotice.status)">{{ currentNotice.status }}</span>
                  </div>
                  <div class="doc-card__bd">
                    <div class="doc-grid" v-if="isLoadFlow">
                      <div><span class="doc-label">单据类型</span>{{ currentNotice.docType }}</div>
                      <div><span class="doc-label">计划执行</span>{{ currentNotice.planDate }}</div>
                      <div v-if="currentNotice.loadArea" class="full"><span class="doc-label">装卸区域</span>{{ currentNotice.loadArea }}</div>
                      <div v-if="currentNotice.remark" class="full"><span class="doc-label">备注</span>{{ currentNotice.remark }}</div>
                    </div>
                    <div class="doc-grid" v-else>
                      <div><span class="doc-label">{{ flowMeta.partnerLabel || '往来单位' }}</span>{{ currentNotice.partner || currentNotice.supplier }}</div>
                      <div><span class="doc-label">计划执行日期</span>{{ currentNotice.planDate }}</div>
                      <div><span class="doc-label">{{ flowMeta.refLabel || '关联单据' }}</span>{{ currentNotice.refNo || currentNotice.poNo || '—' }}</div>
                      <div><span class="doc-label">单据类型</span>{{ currentNotice.docType }}</div>
                      <div v-if="currentNotice.dispatchNo" class="full"><span class="doc-label">关联派车申请单</span>{{ currentNotice.dispatchNo }}</div>
                    </div>
                  </div>
                </div>
                <div class="m-group__title">物料明细（{{ (currentNotice.lines||[]).length }} 行）</div>
                <div
                  v-for="line in currentNotice.lines" :key="line.lineNo"
                  class="line-card" :class="{ done: line.status==='已完成' || line.status==='已关闭' }"
                  @click="openExec(line)"
                >
                  <span class="line-card__status tag" :class="statusTag(line.status)">{{ line.status }}</span>
                  <div class="line-fields">
                    <div><span class="k">物料编码：</span>{{ line.code }}</div>
                    <div><span class="k">物料名称：</span>{{ line.name }}</div>
                    <div><span class="k">物料规格：</span>{{ line.spec }}</div>
                    <div><span class="k">物料种类：</span>{{ line.kind }}</div>
                    <div><span class="k">库存单位：</span>{{ line.unit }}</div>
                    <div v-if="isLoadFlow"><span class="k">管理方式：</span>{{ line.manageMode || '—' }}</div>

<script src="./js/app-configs.js"></script>
<script>
const { createApp, ref, computed, reactive } = Vue;
const CFG = window.APP_CFG;

createApp({
  setup() {
    const menu = CFG.menu;
    const defaultOpeneds = ['home', 'wh', 'wh-po', 'wh-prod', 'wh-os', 'pkg-mgmt', 'lg'];
    const view = ref('home');
    const flowId = ref('po-in-serial');
    const menuActive = ref('app-home');
    const homeKw = ref('');
    const docKw = ref('');
    const currentNotice = ref(CFG.notices[0]);
    const currentLine = ref(CFG.notices[0].lines[0]);
    const processTab = ref('包装检查');
    const processRef = ref('');
    const stubTitle = ref('');
    const stockExecOverride = ref('');
    const stockRows = ref([]);
    const pkgSearch = reactive({ barcode: '', pkgNo: '' });
    const pkgDetail = ref(null);
    const pkgForm = reactive({
      barcode: '', packSpec: '', material: '', lot: '', unit: '', archiveQty: '', qty: '',
      maker: '', supplier: '', prodDate: '', validPeriod: '', validUnit: '天', expireDate: '', remark: '',
    });
    const operator = CFG.operator;
    const tanks = CFG.tanks;
    const scanRows = ref([...CFG.scanRowsSerial]);
    const tankRows = ref([...CFG.tankRows]);
    const innerRows = ref([...CFG.innerScanRows]);
    const form = reactive({
      loc: '', barcode: '', pkgNo: '', tankBarcode: '', tankNo: '丁A',
      prodDate: '2025-08-01', validDate: '2026-08-01', maker: '天齐锂业股份有限公司', qty: 25,
      lotIn: '', inQty: null, remark: '', lineSideWh: '',
      splitCount: 5, splitScalar: 10, mergeBarcode: '', outerBarcode: '', outerNo: '',
    });
    const procForm = reactive({ text: '', num: null, date: '2025-08-05', sel: '', opt: '1' });
    const recommendVisible = ref(false);
    const lineSideWhOptions = CFG.lineSideWhOptions || [];
    const recommendBarcodes = CFG.recommendBarcodes || [];
    const pkgSrc = reactive({ status: '', material: '', spec: '', unit: '', remain: '', lot: '', loaded: false });
    const splitRows = ref([]);
    const mergeRows = ref([]);
    const outerRows = ref([]);
    const pkgRows = ref([]);
    const wayPoint = ref({});
    const wayBackView = ref('waybill-exec');
    const signForm = reactive({ exType: '无异常', exDesc: '', exHandle: '赔付', exAmt: '', signer: '', phone: '', time: '2025-08-08 16:30' });
    const enrouteForm = reactive({ time: '2025-08-07 15:00', place: '', status: '正常行驶', eta: '2025-08-07 16:00', event: '无异常', remark: '' });
    const enrouteHistory = ref([
      { time: '08-07 10:30', place: '成都绕城高速', status: '正常行驶' },
      { time: '08-07 12:00', place: '成绵高速德阳段', status: '服务区休息' },
      { time: '08-07 14:30', place: '绵阳高新区出口', status: '即将到达' },
    ]);
    const enrouteProcs = ref([
      { name: '位置确认', status: '已完成', user: '张司', time: '10:30' },
      { name: '状态确认', status: '已完成', user: '张司', time: '10:30' },
      { name: '事件记录', status: '待执行', user: '—', time: '—' },
    ]);

    const flowMeta = computed(() => CFG.flowMeta[flowId.value] || {});
    const flowTitle = computed(() => flowMeta.value.title || '');
    const flowMode = computed(() => flowMeta.value.mode || 'serial');
    const isLineSidePick = computed(() => flowMeta.value.execVariant === 'line-side-pick');
    const isLoadFlow = computed(() => flowMeta.value.execVariant === 'load');
    const loadProcs = computed(() => (currentLine.value && currentLine.value.procs) || []);
    const activeExecMode = computed(() => {
      if (flowMode.value === 'stocktake') return stockExecOverride.value || 'serial';
      if (flowMode.value === 'inner') return 'inner';
      return flowMode.value;
    });
    const pkgEditable = computed(() => pkgDetail.value && pkgDetail.value.useStatus === '在用' && pkgDetail.value.stockStatus === '厂外');
    const pkgQueryPairs = computed(() => {
      const d = pkgDetail.value;
      if (!d) return [];
      return [
        ['条码号', d.barcode], ['包装规格', d.packSpec], ['物料信息', d.material], ['物料批号', d.lot],
        ['库存单位', d.unit], ['当前数量', d.qty], ['生产厂家', d.maker], ['供应商信息', d.supplier],
        ['生产日期', d.prodDate], ['有效期', `${d.validPeriod || '—'} ${d.validUnit || ''}`.trim()],
        ['失效日期', d.expireDate], ['使用状态', d.useStatus], ['库存状态', d.stockStatus],
        ['存储位置', d.loc], ['绑定状态', d.bindStatus], ['当前绑定外包材', d.bindOuter],
        ['当前步骤', d.step], ['来源单号', d.sourceNo], ['备注', d.remark || '—'],
      ];
    });
    const headerHint = computed(() => {
      if (view.value === 'home') return 'APP 首页 · 仓储 / 包材 / 物流可点通';
      const map = { docs: '单据页', materials: '物料明细页', exec: '执行页', process: '工序页', stub: '占位', 'pkg-arch': '包材建档', 'pkg-create': '新增档案', 'pkg-query': '信息查询', 'waybill-exec': '运单执行', 'waybill-pickup': '提货确认', 'waybill-sign': '签收确认', 'waybill-enroute': '在途信息' };
      return `${flowTitle.value} · ${map[view.value] || view.value}`;
    });

    const filteredHome = computed(() => {
      const kw = homeKw.value.trim();
      if (!kw) return CFG.homeModules;
      return CFG.homeModules.map(g => ({
        ...g,
        items: g.items.filter(it => it.name.includes(kw)),
      })).filter(g => g.items.length);
    });

    const currentDocs = computed(() => {
      const key = flowMeta.value.docsKey || 'default';
      let list = (CFG.docsMap && CFG.docsMap[key]) || CFG.notices || [];
      if (flowMode.value === 'inner') {
        const want = flowMeta.value.innerType === 'xfer' ? '物料转序' : '货物移库';
        list = list.filter(n => n.docType === want);
      }
      return list;
    });

    const filteredNotices = computed(() => {
      const kw = docKw.value.trim();
      const list = currentDocs.value;
      if (!kw) return list;
      return list.filter(n =>
        [n.id, n.partner, n.supplier, n.refNo, n.poNo, n.materialSummary, n.dispatchNo, n.docType, n.driver, n.plate, n.route, n.shipMode, n.loadArea, n.remark, n.creator, n.takeMode].join(' ').includes(kw)
      );
    });

    const scanQtySum = computed(() => scanRows.value.reduce((s, r) => s + Number(r.qty || 0), 0));
    const tankQtySum = computed(() => tankRows.value.reduce((s, r) => s + Number(r.afterQty || 0), 0));
    const innerQtySum = computed(() => innerRows.value.reduce((s, r) => s + Number(r.qty || 0), 0));
    const allLinesDone = computed(() => (currentNotice.value?.lines || []).every(l => l.status === '已完成' || l.status === '已关闭'));
    const splitRemain = computed(() => {
      const base = Number(pkgSrc.remain) || 0;
      const used = splitRows.value.reduce((s, r) => s + Number(r.qty || 0), 0);
      return base - used;
    });
    const mergeRemain = computed(() => {
      const base = Number(pkgSrc.remain) || 0;
      const add = mergeRows.value.reduce((s, r) => s + Number(r.remain || 0), 0);
      return base + add;

      wayBackView.value = 'waybill-enroute';
      enrouteForm.place = (currentNotice.value.enroute && currentNotice.value.enroute.location) || '';
      enrouteForm.remark = (currentNotice.value.enroute && currentNotice.value.enroute.remark) || '';
      processTab.value = '位置确认';
      view.value = 'waybill-enroute';
    }
    function goWayProc(p) {
      processTab.value = p.name;
      processRef.value = p.name;
      view.value = 'process';
    }
    function confirmPickup() {
      ElementPlus.ElMessageBox.confirm('确认完成本次提货？', '提货确认', {
        confirmButtonText: '确认提货', cancelButtonText: '返回编辑',
      }).then(() => {
        (wayPoint.value.lines || []).forEach(l => { l.confirmed = true; });
        wayPoint.value.status = '已确认';
        ElementPlus.ElMessage.success('提货确认完成');
        view.value = 'waybill-exec';
      }).catch(() => {});
    }
    function confirmSign() {
      if (!signForm.signer.trim()) { ElementPlus.ElMessage.error('请填写签收人'); return; }
      ElementPlus.ElMessageBox.confirm('确认完成本次签收？', '签收确认', {
        confirmButtonText: '确认签收', cancelButtonText: '返回编辑',
      }).then(() => {
        (wayPoint.value.lines || []).forEach(l => { l.confirmed = true; });
        wayPoint.value.status = '已确认';
        ElementPlus.ElMessage.success('签收确认完成');
        view.value = 'waybill-exec';
      }).catch(() => {});
    }
    function submitEnroute() {
      if (!enrouteForm.place.trim()) { ElementPlus.ElMessage.error('当前位置为必填'); return; }
      ElementPlus.ElMessageBox.confirm('确认提交本次在途信息？', '提交确认', {
        confirmButtonText: '确认提交', cancelButtonText: '返回编辑',
      }).then(() => {
        enrouteHistory.value.unshift({
          time: enrouteForm.time.slice(5),
          place: enrouteForm.place,
          status: enrouteForm.status,
        });
        ElementPlus.ElMessage.success('在途信息已更新');
        view.value = 'waybill-exec';
      }).catch(() => {});
    }
    function submitExec() {
      const mode = activeExecMode.value;
      if (flowMode.value === 'stocktake') {
        ElementPlus.ElMessageBox.confirm('确认提交盘点结果？待盘条目将自动转为盘亏。', '提交确认', {
          confirmButtonText: '确认提交', cancelButtonText: '返回编辑', type: 'warning',
        }).then(() => {
          stockRows.value.forEach(r => { if (r.status === '待盘') r.status = '盘亏'; });
          syncStockStats();
          const hasEx = stockRows.value.some(r => r.status === '盘盈' || r.status === '盘亏');
          currentNotice.value.status = '已完成';
          toast(hasEx ? '所有待盘条目已转为盘亏，本次盘点结论标记为异常' : '本次盘点账实全部相符，盘点结论标记为正常');
          ElementPlus.ElMessage.success('盘点执行提交完成，数据已同步更新');
          view.value = 'docs';
        }).catch(() => {});
        return;
      }
      if (isLineSidePick.value) {
        if (!form.lineSideWh) { ElementPlus.ElMessage.error('线边仓编码为必填，请选择目标线边仓'); return; }
        if (scanRows.value.some(r => !r.done)) {
          ElementPlus.ElMessage.error('仍存在未执行工序，请完成所有工序后再提交'); return;
        }
        ElementPlus.ElMessageBox.confirm('确认提交所有工序与包材领出数据，提交后单据将流转完成？', '提交确认', {
          confirmButtonText: '确认提交', cancelButtonText: '返回编辑', type: 'warning',
        }).then(() => {
          ElementPlus.ElMessage.success('包材领出工序执行提交成功，单据已流转完成');
          backFromExec({ skipSaveToast: true });
        }).catch(() => {});
        return;
      }
      if (isLoadFlow.value) {
        if (!(form.inQty > 0)) { ElementPlus.ElMessage.error('本次装卸数量必须大于 0'); return; }
        if (form.inQty > Number(currentLine.value.remainQty || 0)) {
          ElementPlus.ElMessage.error('本次数量不能超过未完成数量'); return;
        }
        if ((loadProcs.value || []).some(p => p.status !== '已完成')) {
          ElementPlus.ElMessage.error('仍有工序未完成，请完成所有工序后再提交'); return;
        }
        ElementPlus.ElMessageBox.confirm('确认提交本次装卸执行？', '提交确认', {
          confirmButtonText: '确认提交', cancelButtonText: '返回编辑', type: 'warning',
        }).then(() => {
          const qty = Number(form.inQty);
          currentLine.value.doneQty = Number(currentLine.value.doneQty || 0) + qty;
          currentLine.value.remainQty = Math.max(0, Number(currentLine.value.remainQty || 0) - qty);
          if (currentLine.value.remainQty === 0) currentLine.value.status = '已完成';
          else currentLine.value.status = '执行中';
          ElementPlus.ElMessage.success('装卸执行提交成功，流水状态已更新');
          if (currentLine.value.remainQty === 0) toast('该物料已装卸完成');
          backFromExec({ skipSaveToast: true });
        }).catch(() => {});
        return;
      }
      if (mode === 'serial' || mode === 'count') {
        if (!form.loc) { ElementPlus.ElMessage.error('库位编号为必填，请完善表单'); return; }
      }
      if (mode === 'count' && !(form.inQty > 0)) {
        ElementPlus.ElMessage.error((flowMeta.value.qtyLabel || '数量') + '必须填写正数'); return;
      }
      if (mode === 'tank' && !form.tankNo) {
        ElementPlus.ElMessage.error('储罐编号为必填'); return;
      }
      ElementPlus.ElMessageBox.confirm('是否确认提交当前执行作业？', '提交确认', {
        confirmButtonText: '确认提交', cancelButtonText: '返回编辑', type: 'warning',
      }).then(() => {
        ElementPlus.ElMessage.success('提交成功');
        backFromExec();
      }).catch(() => {});
    }
    function submitProcess() {
      ElementPlus.ElMessageBox.confirm('确认提交当前工序所有表单填报内容吗？', '提交确认', {
        confirmButtonText: '确认提交', cancelButtonText: '返回编辑',
      }).then(() => {
        if (isLineSidePick.value) {
          const ref = processRef.value;
          scanRows.value.forEach(r => {
            if (ref.includes('批量')) {
              if (r.process === processTab.value) r.done = true;
            } else if (r.barcode === ref || String(ref).includes(r.barcode)) {
              r.done = true;
            }
          });
        }
        if (flowMode.value === 'pkg-doc') {
          const ref = processRef.value;
          pkgRows.value.forEach(r => {
            if (String(ref).includes('批量') || r.barcode === ref) r.process = processTab.value;
          });
        }
        if (wayBackView.value === 'waybill-pickup' || wayBackView.value === 'waybill-sign' || wayBackView.value === 'waybill-enroute') {
          const list = wayBackView.value === 'waybill-enroute' ? enrouteProcs.value : (wayPoint.value.procs || []);
          const hit = list.find(p => p.name === processTab.value);
          if (hit) { hit.status = '已完成'; hit.user = operator; hit.time = '15:00'; }
        }
        if (isLoadFlow.value && currentLine.value && currentLine.value.procs) {
          const hit = currentLine.value.procs.find(p => p.name === processTab.value);
          if (hit) { hit.status = '已完成'; hit.summary = '✓ 已填写提交'; }
          if (currentLine.value.status === '待执行') currentLine.value.status = '执行中';
        }
        ElementPlus.ElMessage.success(isLineSidePick.value ? '当前条码工序执行完成' : '工序表单提交成功');
        if (wayBackView.value === 'waybill-pickup' || wayBackView.value === 'waybill-sign' || wayBackView.value === 'waybill-enroute') {
          view.value = wayBackView.value;
        } else {
          view.value = 'exec';
        }
      }).catch(() => {});
    }

    return {
      menu, defaultOpeneds, view, flowId, menuActive, homeKw, docKw,
      currentNotice, currentLine, processTab, processRef, stubTitle,
      stockRows, pkgSearch, pkgDetail, pkgForm, pkgEditable, pkgQueryPairs,
      operator, tanks, scanRows, tankRows, innerRows, form, procForm,
      recommendVisible, lineSideWhOptions, recommendBarcodes,
      pkgSrc, splitRows, mergeRows, outerRows, pkgRows, wayPoint, wayBackView,
      signForm, enrouteForm, enrouteHistory, enrouteProcs,
      flowMeta, flowTitle, flowMode, activeExecMode, isLineSidePick, isLoadFlow, loadProcs, headerHint, filteredHome, filteredNotices,
      scanQtySum, tankQtySum, innerQtySum, allLinesDone, splitRemain, mergeRemain,
      statusTag, toast, goHome, openStub, openModule, onMenuSelect,
      openMaterials, openDocAction, openStockExec, openExec, backFromExec,
      addSerialScan, addPickScan, addTankRow, addInnerScan, openProcess, openLoadProc, goProcessBatch,
      addStockScan, onStockQtyChange,
      openPkgCreateForm, searchPkgArch, updatePkgArch, savePkgCreate, queryPkgInfo,
      openRecommend, useRecommend,
      loadSplitSrc, genSplitRows, refreshSplitCode, submitPkgSplit,
      loadMergeMain, addMergeRow, removeMergeRow, submitPkgMerge,
      addOuterScan, removeOuterRow, submitPkgOuter,
      addPkgDocScan, goPkgProcessBatch, submitPkgDoc,
      openPickup, openSign, openEnroute, goWayProc, confirmPickup, confirmSign, submitEnroute,
      submitExec, submitProcess,
    };
  },
}).use(ElementPlus, { locale: ElementPlusLocaleZhCn }).mount('#app');
</script>
</body>
</html>
